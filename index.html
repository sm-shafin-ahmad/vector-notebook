<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
<title>মাস্টারনোট — উচ্চমাধ্যমিক লার্নিং প্ল্যাটফর্ম</title>
<meta name="description" content="এইচএসসি ও ভর্তি পরীক্ষার সম্পূর্ণ একাডেমিক মাস্টারনোট, প্রতিপাদন, ইন্টারঅ্যাক্টিভ সিমুলেটর ও গাণিতিক সমাধান।"/>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- KaTeX for beautiful math equations -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<!-- Marked.js for markdown parsing -->
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

<style>
/* ── DESIGN TOKENS ── */
:root {
  --font-bangla: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-en: 'Outfit', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  
  --transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ── LIGHT THEME: LUXURY CREME / WARM PARCHMENT ── */
[data-theme="light"] {
  --bg-page: #faf6ee;
  --bg-surface: #f3ecde;
  --bg-card: #ffffff;
  --bg-subtle: #f7f1e4;
  --bg-input: #ffffff;
  --bg-header: rgba(250, 246, 238, 0.94);
  --bg-drawer: #f7f1e4;
  
  --text-main: #221710;
  --text-muted: #6b5543;
  --text-dim: #99806c;
  
  --border-subtle: rgba(146, 95, 48, 0.13);
  --border-card: rgba(146, 95, 48, 0.10);
  --border-focus: #b56920;
  
  --accent-primary: #b56920;
  --accent-hover: #985213;
  --accent-light: rgba(181, 105, 32, 0.12);
  --accent-glow: rgba(181, 105, 32, 0.22);
  
  --accent-teal: #107e65;
  --accent-amber: #d97706;
  --accent-ruby: #be123c;
  
  --code-bg: #eee5d4;
  --code-text: #2c1d13;
  
  --shadow-sm: 0 1px 3px rgba(92, 57, 24, 0.05);
  --shadow-md: 0 4px 16px rgba(92, 57, 24, 0.08);
  --shadow-lg: 0 12px 32px rgba(92, 57, 24, 0.12);
}

/* ── DARK THEME: ROASTED CHOCOLATE COCOA ── */
[data-theme="dark"] {
  --bg-page: #140d09;
  --bg-surface: #1e130d;
  --bg-card: #221610;
  --bg-subtle: #1a100a;
  --bg-input: #190f09;
  --bg-header: rgba(20, 13, 9, 0.94);
  --bg-drawer: #1a100a;
  
  --text-main: #f8efe5;
  --text-muted: #c4ada0;
  --text-dim: #8e776b;
  
  --border-subtle: rgba(226, 155, 82, 0.15);
  --border-card: rgba(226, 155, 82, 0.14);
  --border-focus: #e29b52;
  
  --accent-primary: #e29b52;
  --accent-hover: #f5b06d;
  --accent-light: rgba(226, 155, 82, 0.15);
  --accent-glow: rgba(226, 155, 82, 0.28);
  
  --accent-teal: #34d399;
  --accent-amber: #fbbf24;
  --accent-ruby: #f87171;
  
  --code-bg: #18100b;
  --code-text: #fbeee3;
  
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.65);
}

/* ── GLOBAL RESET ── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body {
  background-color: var(--bg-page);
  color: var(--text-main);
  font-family: var(--font-bangla);
  line-height: 1.7;
  transition: background-color 0.22s ease, color 0.22s ease;
  min-height: 100vh;
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

/* Progress bar */
#reading-progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 0%;
  height: 3.5px;
  background: linear-gradient(90deg, var(--accent-primary), #f59e0b, #ef4444);
  z-index: 1200;
  transition: width 0.1s linear;
}

/* ── STICKY TOP NAVBAR ── */
.site-header {
  position: sticky;
  top: 0;
  z-index: 950;
  background: var(--bg-header);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 8px 16px;
  width: 100%;
}

.header-container {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.menu-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-main);
  cursor: pointer;
  transition: var(--transition);
  font-size: 18px;
}

.menu-toggle-btn:hover {
  border-color: var(--accent-primary);
}

/* 🎨 BESPOKE VECTOR LOGO ── */
.brand-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}

.brand-svg-logo {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  filter: drop-shadow(0 2px 8px var(--accent-glow));
}

.brand-text h1 {
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1.15;
  color: var(--text-main);
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 6px;
}

.brand-badge {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--accent-light);
  color: var(--accent-primary);
  font-family: var(--font-en);
}

.brand-text p {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-weight: 500;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-icon {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}

.btn-icon:hover {
  border-color: var(--accent-primary);
  transform: translateY(-1px);
}

/* Quick Search Button / Input */
.search-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 99px;
  padding: 6px 12px;
  color: var(--text-muted);
  font-size: 0.82rem;
  font-family: var(--font-bangla);
  cursor: pointer;
  transition: var(--transition);
}

.search-btn:hover {
  border-color: var(--accent-primary);
  color: var(--text-main);
}

.search-btn kbd {
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.7rem;
  font-family: var(--font-mono);
}

/* ── BREADCRUMB & CONTEXT BAR ── */
.context-bar {
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--border-subtle);
  padding: 6px 16px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.context-container {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.breadcrumb-trail {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  white-space: nowrap;
}

.breadcrumb-item {
  color: var(--text-muted);
  text-decoration: none;
  font-weight: 500;
}

.breadcrumb-item.active {
  color: var(--accent-primary);
  font-weight: 700;
}

.reading-badge {
  font-size: 0.75rem;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ── APP MAIN LAYOUT (2 COLUMNS) ── */
.app-layout {
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
  display: grid;
  grid-template-columns: 290px 1fr;
  gap: 32px;
  padding: 20px 20px 80px 20px;
  flex: 1;
}

/* ── HIERARCHICAL SUBJECT/CHAPTER SIDEBAR ── */
.sidebar {
  position: sticky;
  top: 92px;
  height: calc(100vh - 110px);
  overflow-y: auto;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scrollbar-width: thin;
}

/* Subject Selector Dropdown */
.subject-picker {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.subject-picker label {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
}

.subject-select {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-family: var(--font-bangla);
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text-main);
  cursor: pointer;
  outline: none;
  transition: var(--transition);
  width: 100%;
}

.subject-select:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

/* Chapter Accordion Group */
.chapter-tree {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.chapter-block {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.chapter-title {
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  transition: var(--transition);
  user-select: none;
}

.chapter-title:hover {
  background: var(--bg-card);
  color: var(--text-main);
}

.chapter-badge {
  font-size: 0.7rem;
  font-family: var(--font-en);
  background: var(--bg-subtle);
  padding: 1px 6px;
  border-radius: 99px;
  color: var(--text-muted);
}

.module-nav-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-left: 8px;
  border-left: 2px solid var(--border-subtle);
  margin-left: 6px;
}

.module-nav-item a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  border-radius: var(--radius-xs);
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.84rem;
  font-weight: 500;
  transition: var(--transition);
  line-height: 1.35;
}

.module-nav-item a:hover {
  color: var(--text-main);
  background: var(--bg-card);
}

.module-nav-item.active a {
  color: var(--accent-primary);
  background: var(--bg-card);
  font-weight: 700;
  box-shadow: var(--shadow-sm);
}

.module-nav-item .tag {
  font-size: 0.65rem;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--bg-subtle);
  color: var(--text-dim);
}

.module-nav-item.active .tag {
  background: var(--accent-light);
  color: var(--accent-primary);
}

/* Extra Tools in Sidebar */
.sidebar-tools-section {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sidebar-tool-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-xs);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
  font-family: var(--font-bangla);
  font-size: 0.84rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
}

.sidebar-tool-btn:hover {
  border-color: var(--accent-primary);
  transform: translateY(-1px);
}

/* ── MAIN READING CONTENT AREA ── */
.main-content {
  min-width: 0;
  width: 100%;
  max-width: 900px;
}

/* ── MARKDOWN & MATH TYPOGRAPHY ── */
.markdown-body {
  font-size: 1.05rem;
  color: var(--text-main);
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.markdown-body h1 {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--text-main);
  border-bottom: 2px solid var(--border-subtle);
  padding-bottom: 12px;
  margin: 0 0 24px 0;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.markdown-body h2 {
  font-size: 1.38rem;
  font-weight: 700;
  color: var(--accent-primary);
  margin: 36px 0 16px 0;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-subtle);
  line-height: 1.35;
}

.markdown-body h3 {
  font-size: 1.18rem;
  font-weight: 600;
  color: var(--text-main);
  margin: 24px 0 12px 0;
  line-height: 1.4;
}

.markdown-body p {
  margin-bottom: 16px;
  line-height: 1.75;
}

.markdown-body ul, .markdown-body ol {
  margin: 12px 0 18px 24px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.markdown-body li {
  line-height: 1.65;
}

.markdown-body blockquote {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-left: 4px solid var(--accent-primary);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin: 20px 0;
  font-style: normal;
  color: var(--text-main);
}

.markdown-body blockquote strong {
  color: var(--accent-primary);
}

/* Tables — Mobile Responsive */
.table-wrap {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 20px 0;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
}

.markdown-body table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.92rem;
  text-align: left;
}

.markdown-body th {
  background: var(--bg-subtle);
  color: var(--text-main);
  font-weight: 700;
  padding: 12px 16px;
  border-bottom: 2px solid var(--border-subtle);
  white-space: nowrap;
}

.markdown-body td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
}

.markdown-body tr:last-child td {
  border-bottom: none;
}

/* Code & ASCII Diagrams */
.markdown-body pre {
  background: var(--code-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  font-family: var(--font-mono);
  font-size: 0.88rem;
  line-height: 1.45;
  color: var(--code-text);
  margin: 18px 0;
  max-width: 100%;
}

.markdown-body code {
  font-family: var(--font-mono);
  background: var(--bg-subtle);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.88em;
  color: var(--accent-primary);
}

.markdown-body pre code {
  background: transparent;
  padding: 0;
  color: inherit;
}

/* KaTeX Math Blocks - Compact, Connected & Seamless */
.katex-display {
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 6px 12px;
  margin: 8px 0;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-card);
  max-width: 100%;
}

.katex-display + .katex-display {
  margin-top: -3px;
}

.katex-display .katex {
  font-size: 1.06em;
  line-height: 1.45;
}

/* ── VISUAL PHYSICS DIAGRAMS & ILLUSTRATIONS ── */
.diagram-box {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px;
  margin: 22px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: var(--transition);
}

.diagram-box:hover {
  border-color: var(--accent-primary);
  box-shadow: var(--shadow-md);
}

.diagram-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin: 22px 0;
  width: 100%;
}

.diagram-grid .diagram-box {
  margin: 0;
}

.physics-diagram {
  width: 100%;
  max-width: 100%;
  height: auto;
  display: block;
}

.diagram-caption {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-muted);
  margin-top: 10px;
  text-align: center;
  line-height: 1.4;
}

/* ── PRACTICE CHALLENGES & HOMEWORK CARDS ── */
.practice-card {
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-left: 4px solid var(--accent-teal);
  border-radius: var(--radius-sm);
  padding: 18px 20px;
  margin: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.practice-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.practice-badge {
  background: var(--accent-teal);
  color: #ffffff;
  font-size: 0.72rem;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: var(--radius-xs);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.practice-header h4 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-main);
}

.practice-collapse {
  margin-top: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.practice-summary {
  padding: 10px 14px;
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--accent-primary);
  cursor: pointer;
  background: rgba(181, 105, 32, 0.06);
  user-select: none;
  transition: var(--transition);
}

.practice-summary:hover {
  background: rgba(181, 105, 32, 0.12);
}

.practice-solution {
  padding: 14px 16px;
  border-top: 1px solid var(--border-subtle);
  font-size: 0.94rem;
  line-height: 1.65;
}

/* ── PREV / NEXT NAVIGATION FOOTER ── */
.module-nav-footer {
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.nav-footer-btn {
  display: flex;
  flex-direction: column;
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  text-decoration: none;
  color: inherit;
  transition: var(--transition);
  max-width: 48%;
  cursor: pointer;
}

.nav-footer-btn:hover {
  border-color: var(--accent-primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}

.nav-footer-btn .direction {
  font-size: 0.74rem;
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
}

.nav-footer-btn .title {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--accent-primary);
}

/* ── INTERACTIVE SIMULATORS TAB ── */
.simulators-container {
  display: flex;
  flex-direction: column;
  gap: 24px;
  width: 100%;
}

.simulators-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  width: 100%;
}

.sim-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow-sm);
  width: 100%;
}

.sim-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-subtle);
}

.sim-card-header h3 {
  font-size: 1.08rem;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.25;
}

.sim-form-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.input-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.input-field label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
}

.input-field input, .input-field select {
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xs);
  padding: 8px 10px;
  font-family: var(--font-en), var(--font-bangla);
  font-size: 0.9rem;
  color: var(--text-main);
  outline: none;
  transition: var(--transition);
  width: 100%;
}

.input-field input:focus, .input-field select:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

.calc-btn {
  background: var(--accent-primary);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-family: var(--font-bangla);
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
}

.calc-btn:hover {
  background: var(--accent-hover);
}

.sim-results {
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xs);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.res-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.86rem;
  line-height: 1.35;
}

.res-row span.label {
  color: var(--text-muted);
}

.res-row span.val {
  font-family: var(--font-en);
  font-weight: 700;
  color: var(--accent-primary);
}

.sim-canvas {
  width: 100%;
  height: 140px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xs);
  display: block;
}

/* ── SEARCH MODAL (COMMAND PALETTE) ── */
.search-modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 2000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 16px;
}

.search-modal-backdrop.open {
  display: flex;
}

.search-modal {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  width: 100%;
  max-width: 580px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.search-modal-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  gap: 10px;
}

.search-modal-input {
  border: none;
  background: transparent;
  width: 100%;
  font-family: var(--font-bangla);
  font-size: 1.05rem;
  color: var(--text-main);
  outline: none;
}

.search-modal-results {
  max-height: 380px;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.search-result-item {
  padding: 10px 14px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.search-result-item:hover {
  background: var(--accent-light);
}

.search-result-item .item-title {
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--accent-primary);
}

.search-result-item .item-snippet {
  font-size: 0.8rem;
  color: var(--text-muted);
}

/* ── TOAST NOTIFICATION ── */
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--bg-card);
  color: var(--text-main);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 10px 18px;
  box-shadow: var(--shadow-lg);
  font-weight: 600;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 6px;
  transform: translateY(80px);
  opacity: 0;
  transition: var(--transition);
  z-index: 1500;
}

#toast.show {
  transform: translateY(0);
  opacity: 1;
}

/* ── BACK TO TOP BUTTON ── */
#back-to-top {
  position: fixed;
  bottom: 24px;
  left: 24px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--bg-card);
  color: var(--text-main);
  border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  transform: translateY(20px);
  transition: var(--transition);
  z-index: 800;
  font-size: 16px;
  font-weight: bold;
}

#back-to-top.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ═══════════════════════════════════════════════
   ── MOBILE RESPONSIVE DRAWER & OVERRIDES (< 900px) ──
   ═══════════════════════════════════════════════ */
@media (max-width: 900px) {
  .app-layout {
    display: block;
    padding: 16px 14px 70px 14px;
    width: 100%;
    max-width: 100%;
  }

  /* Mobile Slide-in Drawer for Subjects & Chapters */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 290px;
    height: 100vh;
    z-index: 1300;
    border-radius: 0;
    background: var(--bg-surface);
    box-shadow: var(--shadow-lg);
    transform: translateX(-100%);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    border: none;
    border-right: 1px solid var(--border-subtle);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  /* Drawer Backdrop */
  .drawer-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    z-index: 1250;
    display: none;
  }

  .drawer-backdrop.open {
    display: block;
  }

  .markdown-body h1 {
    font-size: 1.45rem;
    margin-bottom: 14px;
  }
  
  .markdown-body h2 {
    font-size: 1.22rem;
    margin: 28px 0 12px 0;
  }

  .markdown-body h3 {
    font-size: 1.05rem;
  }

  .brand-text p {
    display: none;
  }

  .search-btn span:not(.search-icon) {
    display: none;
  }

  .search-btn {
    padding: 6px 8px;
  }

  .simulators-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .module-nav-footer {
    flex-direction: column;
    align-items: stretch;
  }

  .nav-footer-btn {
    max-width: 100%;
  }
}
</style>
</head>

            { id: "p1_c2_m1", title: "মডিউল ০১: বেসিক ও সামান্তরিক সূত্র", duration: "২৫ মিনিট", tag: "ফাউন্ডেশন", md: "# পদার্থবিজ্ঞান ১ম পত্র — অধ্যায় ২: ভেক্টর | মডিউল ০১: ভেক্টরের মৌলিক ধারণা ও সামান্তরিক সূত্র\n\n---\n\n## ১. ভৌত রাশি ও স্কেলার বনাম ভেক্টর রাশি\n\n### ১.১ ভৌত রাশি (Physical Quantity) কী?\nভৌত জগতে যা কিছু সরাসরি বা পরোক্ষভাবে পরিমাপ করা যায়, তাকে **ভৌত রাশি (Physical Quantity)** বলে। যেমন: কোনো বস্তুর দৈর্ঘ্য, ভর, সময়, তাপমাত্রা, বেগ, ত্বরণ, বল ইত্যাদি।\n\nপরিমাপের বৈশিষ্ট্যের ওপর ভিত্তি করে ভৌত রাশিকে প্রধানত দুটি শ্রেণিতে ভাগ করা হয়:\n1. **অদিক রাশি বা স্কেলার রাশি (Scalar Quantity)**\n2. **দিক রাশি বা ভেক্টর রাশি (Vector Quantity)**\n\n---\n\n### ১.২ স্কেলার ও ভেক্টর রাশির গভীর তুলনামূলক বিশ্লেষণ\n\n| বৈশিষ্ট্য | স্কেলার রাশি (Scalar Quantity) | ভেক্টর রাশি (Vector Quantity) |\n| :--- | :--- | :--- |\n| **সংজ্ঞা** | যে সকল ভৌত রাশিকে সম্পূর্ণরূপে প্রকাশ করার জন্য শুধুমাত্র **মান** (Magnitude)-এর প্রয়োজন হয়, কোনো দিকের প্রয়োজন হয় না। | যে সকল ভৌত রাশিকে সম্পূর্ণরূপে প্রকাশ করার জন্য **মান ও দিক** (Magnitude & Direction) উভয়েরই প্রয়োজন হয়। |\n| **বীজগণিতীয় নিয়ম** | সাধারণ পাটিগণিত বা বীজগণিতের নিয়মে ($২ + ৩ = ৫$) এদের যোগ, বিয়োগ, গুণ করা যায়। | সাধারণ বীজগণিতের নিয়মে যোগ-বিয়োগ করা যায় না; এরা ভেক্টর বীজগণিতের জ্যামিতিক নিয়ম (যেমন: সামান্তরিক সূত্র, ত্রিভুজ সূত্র) মেনে চলে। |\n| **পরিবর্তন** | কেবল মানের পরিবর্তন হলে রাশির পরিবর্তন ঘটে। | ১. কেবল মানের পরিবর্তনে,<br>২. কেবল দিকের পরিবর্তনে, অথবা<br>৩. মান ও দিক উভয়ের পরিবর্তনে পরিবর্তিত হয়। |\n| **উদাহরণ** | দৈর্ঘ্য, ভর, সময়, তাপমাত্রা, দ্রুতি, দূরত্ব, কাজ, বিভব, ক্ষমতা, শক্তি, ঘনত্ব ইত্যাদি। | সরণ, বেগ, ত্বরণ, বল, ভরবেগ, বলের ঘাত, মহাকর্ষীয় প্রাবল্য, টর্ক, চৌম্বক আবেশ ইত্যাদি। |\n\n---\n\n### ১.৩ গুরুত্বপূর্ণ অনুধাবনমূলক প্রশ্ন ও ব্যতিক্রমী কেস\n\n#### ❓ প্রশ্ন ১: \"তড়িৎপ্রবাহ (Electric Current) দিক থাকা সত্ত্বেও কেন স্কেলার রাশি?\"\n- **গভীর বৈজ্ঞানিক ব্যাখ্যা:** কোনো রাশি ভেক্টর হতে হলে তাকে কেবল নির্দিষ্ট দিক থাকলেই চলে না, তাকে অবশ্যই **ভেক্টর যোগের নিয়ম (সামান্তরিক সূত্র বা ত্রিভুজ সূত্র)** মেনে চলতে হয়।\n- একটি পরিবাহীর সংযোগস্থলে যদি দুটি তার দিয়ে $3\\text{ A}$ এবং $4\\text{ A}$ প্রবাহ যে কোণেই মিলিত হোক না কেন, তাদের সংযোগস্থলে মোট নির্গমন প্রবাহ সর্বদা সাধারণ পাটিগণিতের নিয়মে $3 + 4 = 7\\text{ A}$ হয়। এটি তার দুটির মধ্যবর্তী কোণের ওপর নির্ভর করে না এবং ভেক্টর যোগের সামান্তরিক সূত্র মানে না। তাই নির্দিষ্ট দিক থাকা সত্ত্বেও তড়িৎপ্রবাহ একটি **স্কেলার রাশি**।\n\n#### ❓ প্রশ্ন ২: \"চাপ (Pressure) ও পৃষ্ঠটান (Surface Tension) কেন স্কেলার রাশি?\"\n- **চাপ:** চাপ হলো প্রতি একক ক্ষেত্রফলের ওপর লম্বভাবে প্রযুক্ত বল ($P = F/A$)। কোনো আবদ্ধ তরল বা বায়বীয় পদার্থের অভ্যন্তরে চাপ কোনো একক নির্দিষ্ট দিকে কাজ করে না, বরং পাত্রের দেওয়ালে সকল দিকে অভিলম্বভাবে ক্রিয়া করে। এর কোনো সুনির্দিষ্ট একক অভিমুখ নেই। তাই চাপ স্কেলার রাশি।\n\n---\n\n## ২. ভেক্টরের জ্যামিতিক ও প্রতীকী প্রকাশ\n\n### ২.১ জ্যামিতিক প্রকাশ (Graphical Representation)\nএকটি নির্দিষ্ট দৈর্ঘ্যের তীরচিহ্নযুক্ত সরলরেখাংশ দ্বারা ভেক্টর রাশিকে জ্যামিতিকভাবে উপস্থাপন করা হয়:\n\n\n<div class=\"diagram-box\">\n  <svg viewBox=\"0 0 540 280\" class=\"physics-diagram\">\n    <!-- Grid and Coordinate Planes -->\n    <path d=\"M 80 220 L 260 220 L 460 160 L 280 160 Z\" fill=\"rgba(217, 119, 6, 0.05)\" stroke=\"var(--border-subtle)\" stroke-dasharray=\"3,3\"/>\n    <path d=\"M 80 220 L 80 50 L 280 50 L 280 160 L 80 220\" fill=\"rgba(13, 148, 136, 0.04)\" stroke=\"var(--border-subtle)\" stroke-dasharray=\"3,3\"/>\n    \n    <!-- Axes -->\n    <!-- X-Axis -->\n    <line x1=\"80\" y1=\"220\" x2=\"480\" y2=\"220\" stroke=\"var(--text-main)\" stroke-width=\"2\" marker-end=\"url(#arrow-muted)\"/>\n    <text x=\"490\" y=\"225\" fill=\"var(--text-main)\" font-weight=\"700\" font-size=\"14\">X</text>\n    \n    <!-- Y-Axis -->\n    <line x1=\"80\" y1=\"220\" x2=\"80\" y2=\"30\" stroke=\"var(--text-main)\" stroke-width=\"2\" marker-end=\"url(#arrow-muted)\"/>\n    <text x=\"75\" y=\"20\" fill=\"var(--text-main)\" font-weight=\"700\" font-size=\"14\">Y</text>\n    \n    <!-- Z-Axis (Isometric angle) -->\n    <line x1=\"80\" y1=\"220\" x2=\"290\" y2=\"155\" stroke=\"var(--text-main)\" stroke-width=\"2\" marker-end=\"url(#arrow-muted)\"/>\n    <text x=\"300\" y=\"150\" fill=\"var(--text-main)\" font-weight=\"700\" font-size=\"14\">Z</text>\n    \n    <!-- Origin -->\n    <circle cx=\"80\" cy=\"220\" r=\"4\" fill=\"var(--text-main)\"/>\n    <text x=\"65\" y=\"238\" fill=\"var(--text-main)\" font-weight=\"700\" font-size=\"13\">O (0,0,0)</text>\n\n    <!-- 3D Vector A -->\n    <line x1=\"80\" y1=\"220\" x2=\"380\" y2=\"70\" stroke=\"#e11d48\" stroke-width=\"3.5\" marker-end=\"url(#arrow-ruby)\"/>\n    <circle cx=\"380\" cy=\"70\" r=\"5\" fill=\"#e11d48\"/>\n    <text x=\"390\" y=\"65\" fill=\"#e11d48\" font-weight=\"800\" font-size=\"15\">P (Ax, Ay, Az) → A⃗</text>\n\n    <!-- Component Projections -->\n    <line x1=\"380\" y1=\"70\" x2=\"380\" y2=\"160\" stroke=\"#0d9488\" stroke-width=\"1.8\" stroke-dasharray=\"4,4\"/>\n    <line x1=\"380\" y1=\"160\" x2=\"380\" y2=\"220\" stroke=\"#78716c\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n    <line x1=\"380\" y1=\"160\" x2=\"180\" y2=\"160\" stroke=\"#78716c\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n    <line x1=\"80\" y1=\"70\" x2=\"380\" y2=\"70\" stroke=\"#0d9488\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\"/>\n    \n    <!-- Labels on Axes -->\n    <text x=\"230\" y=\"238\" fill=\"#d97706\" font-weight=\"700\" font-size=\"12\">Ax (X-উপাংশ)</text>\n    <text x=\"15\" y=\"140\" fill=\"#0d9488\" font-weight=\"700\" font-size=\"12\">Ay (Y-উপাংশ)</text>\n    <text x=\"190\" y=\"150\" fill=\"#2563eb\" font-weight=\"700\" font-size=\"12\">Az (Z-উপাংশ)</text>\n\n    <!-- Angle Arcs -->\n    <!-- Alpha (with X) -->\n    <path d=\"M 160 220 A 80 80 0 0 0 148 186\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"2\"/>\n    <text x=\"168\" y=\"205\" fill=\"#d97706\" font-weight=\"700\" font-size=\"13\">α</text>\n\n    <!-- Beta (with Y) -->\n    <path d=\"M 80 140 A 80 80 0 0 0 132 146\" fill=\"none\" stroke=\"#0d9488\" stroke-width=\"2\"/>\n    <text x=\"100\" y=\"130\" fill=\"#0d9488\" font-weight=\"700\" font-size=\"13\">β</text>\n\n    <!-- Gamma (with Z) -->\n    <path d=\"M 140 201 A 70 70 0 0 0 130 178\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/>\n    <text x=\"142\" y=\"180\" fill=\"#2563eb\" font-weight=\"700\" font-size=\"13\">γ</text>\n  </svg>\n  <div class=\"diagram-caption\">চিত্র ৪.১: ত্রিমাত্রিক আয়ত স্থানাঙ্ক ব্যবস্থায় ভেক্টর $\u000bec{A}$ এবং দিক কোসাইন কোণত্রয় ($\u0007lpha, \beta, \\gamma$)</div>\n</div>\n\n                Y ▲\n                  │          P (Ax, Ay)\n                  │         /│\n                  │        / │\n                  │    A⃗  /  │ Ay\n                  │      /   │\n                  │     /θ   │\n                  O────┴─────┴──────► X\n                       Ax\n\n<div class=\"diagram-box\">\n  <svg viewBox=\"0 0 540 270\" class=\"physics-diagram\">\n    <!-- Parallelogram Body -->\n    <!-- OA (P) -->\n    <line x1=\"60\" y1=\"210\" x2=\"310\" y2=\"210\" stroke=\"#d97706\" stroke-width=\"3.5\" marker-end=\"url(#arrow-amber)\"/>\n    <text x=\"180\" y=\"235\" fill=\"#d97706\" font-weight=\"800\" font-size=\"15\">P⃗ (OA)</text>\n\n    <!-- OB (Q) -->\n    <line x1=\"60\" y1=\"210\" x2=\"190\" y2=\"55\" stroke=\"#0d9488\" stroke-width=\"3.5\" marker-end=\"url(#arrow-teal)\"/>\n    <text x=\"100\" y=\"125\" fill=\"#0d9488\" font-weight=\"800\" font-size=\"15\">Q⃗ (OB)</text>\n\n    <!-- Parallelogram upper lines (Dotted) -->\n    <line x1=\"190\" y1=\"55\" x2=\"440\" y2=\"55\" stroke=\"var(--border-subtle)\" stroke-width=\"1.8\" stroke-dasharray=\"5,4\"/>\n    <line x1=\"310\" y1=\"210\" x2=\"440\" y2=\"55\" stroke=\"#0d9488\" stroke-width=\"2\" stroke-dasharray=\"5,4\"/>\n    <text x=\"390\" y=\"125\" fill=\"#0d9488\" font-weight=\"700\" font-size=\"13\">AC = Q</text>\n\n    <!-- Resultant OC (R) -->\n    <line x1=\"60\" y1=\"210\" x2=\"440\" y2=\"55\" stroke=\"#e11d48\" stroke-width=\"4\" marker-end=\"url(#arrow-ruby)\"/>\n    <text x=\"250\" y=\"115\" fill=\"#e11d48\" font-weight=\"800\" font-size=\"16\">R⃗ = P⃗ + Q⃗ (কর্ণ OC)</text>\n\n    <!-- Extension AD and Perpendicular CD -->\n    <line x1=\"310\" y1=\"210\" x2=\"440\" y2=\"210\" stroke=\"var(--text-dim)\" stroke-width=\"1.8\" stroke-dasharray=\"4,4\"/>\n    <line x1=\"440\" y1=\"55\" x2=\"440\" y2=\"210\" stroke=\"#2563eb\" stroke-width=\"2\"/>\n    <rect x=\"424\" y=\"194\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"1.2\"/>\n    \n    <!-- Labels for D, C, A, B, O -->\n    <circle cx=\"60\" cy=\"210\" r=\"4.5\" fill=\"var(--text-main)\"/>\n    <text x=\"45\" y=\"225\" fill=\"var(--text-main)\" font-weight=\"800\" font-size=\"14\">O</text>\n\n    <circle cx=\"310\" cy=\"210\" r=\"4.5\" fill=\"var(--text-main)\"/>\n    <text x=\"305\" y=\"235\" fill=\"var(--text-main)\" font-weight=\"800\" font-size=\"14\">A</text>\n\n    <circle cx=\"440\" cy=\"210\" r=\"4.5\" fill=\"var(--text-main)\"/>\n    <text x=\"445\" y=\"230\" fill=\"var(--text-main)\" font-weight=\"800\" font-size=\"14\">D</text>\n\n    <circle cx=\"190\" cy=\"55\" r=\"4.5\" fill=\"var(--text-main)\"/>\n    <text x=\"175\" y=\"45\" fill=\"var(--text-main)\" font-weight=\"800\" font-size=\"14\">B</text>\n\n    <circle cx=\"440\" cy=\"55\" r=\"4.5\" fill=\"#e11d48\"/>\n    <text x=\"448\" y=\"50\" fill=\"#e11d48\" font-weight=\"800\" font-size=\"14\">C</text>\n\n    <!-- Component formula texts -->\n    <text x=\"345\" y=\"228\" fill=\"#d97706\" font-size=\"12\" font-weight=\"700\">AD = Q cos α</text>\n    <text x=\"448\" y=\"140\" fill=\"#2563eb\" font-size=\"12\" font-weight=\"700\">CD = Q sin α</text>\n\n    <!-- Angle Arcs -->\n    <!-- Alpha (between P and Q) -->\n    <path d=\"M 120 210 A 60 60 0 0 0 102 160\" fill=\"none\" stroke=\"#0d9488\" stroke-width=\"2.2\"/>\n    <text x=\"125\" y=\"185\" fill=\"#0d9488\" font-weight=\"800\" font-size=\"13\">α</text>\n\n    <!-- Alpha at A -->\n    <path d=\"M 360 210 A 50 50 0 0 0 348 168\" fill=\"none\" stroke=\"#0d9488\" stroke-width=\"1.8\"/>\n    <text x=\"365\" y=\"195\" fill=\"#0d9488\" font-weight=\"700\" font-size=\"12\">α</text>\n\n    <!-- Theta (between P and R) -->\n    <path d=\"M 150 210 A 90 90 0 0 0 138 178\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"2.5\"/>\n    <text x=\"155\" y=\"200\" fill=\"#e11d48\" font-weight=\"800\" font-size=\"13\">θ</text>\n  </svg>\n  <div class=\"diagram-caption\">চিত্র ৬.১: সামান্তরিক সূত্রের সাহায্যে লব্ধির মান ($R$) ও দিক ($\theta$) নির্ণয়ের সম্পূর্ণ জ্যামিতিক চিত্র ($CD \\perp OD$)</div>\n</div>\n\n\n### ৬.২ লব্ধির মান ($R$) নির্ণয়ের নিখুঁত জ্যামিতিক প্রমাণ\nমনে করি, $O$ বিন্দুতে ক্রিয়ারত দুটি ভেক্টর $\\vec{P}$ ও $\\vec{Q}$-এর মধ্যবর্তী কোণ $\\angle AOB = \\alpha$।\n$OA = P$, $OB = Q$ ধরে $OACB$ সামান্তরিক অঙ্কন করা হলো। তাহলে কর্ণ $OC = \\vec{R}$ হলো লব্ধি।\n\n$OA$ বাহুকে $D$ পর্যন্ত বর্ধিত করি এবং $C$ বিন্দু থেকে $OA$-এর বর্ধিতাংশের ওপর $CD$ লম্ব টানি ($CD \\perp OD$)।\nযেহেতু $AC \\parallel OB$, সুতরাং $AC = OB = Q$ এবং $\\angle CAD = \\angle AOB = \\alpha$।\n\nসমকোণী ত্রিভুজ $\\triangle ACD$ হতে:\n$$\\cos\\alpha = \\frac{AD}{AC} \\implies AD = AC\\cos\\alpha = Q\\cos\\alpha$$\n$$\\sin\\alpha = \\frac{CD}{AC} \\implies CD = AC\\sin\\alpha = Q\\sin\\alpha$$\n\nএখন, সমকোণী ত্রিভুজ $\\triangle OCD$-তে পিথাগোরাসের উপপাদ্য প্রয়োগ করে:\n$$OC^2 = OD^2 + CD^2$$\n$$OC^2 = (OA + AD)^2 + CD^2$$\n$$R^2 = (P + Q\\cos\\alpha)^2 + (Q\\sin\\alpha)^2$$\n$$R^2 = P^2 + 2PQ\\cos\\alpha + Q^2\\cos^2\\alpha + Q^2\\sin^2\\alpha$$\n$$R^2 = P^2 + 2PQ\\cos\\alpha + Q^2(\\cos^2\\alpha + \\sin^2\\alpha)$$\n$$R^2 = P^2 + Q^2 + 2PQ\\cos\\alpha \\quad [\\because \\cos^2\\alpha + \\sin^2\\alpha = 1]$$\n\n$$\\mathbf{R = \\sqrt{P^2 + Q^2 + 2PQ\\cos\\alpha}}$$\n\n### ৬.৩ লব্ধির দিক ($\\theta$) নির্ণয়ের প্রতিপাদন\nধরি, লব্ধি $\\vec{R}$ ভেক্টরটি $\\vec{P}$ ভেক্টরের সাথে $\\theta$ কোণ তৈরি করেছে ($\\angle COD = \\theta$)।\nসমকোণী ত্রিভুজ $\\triangle OCD$ হতে:\n$$\\tan\\theta = \\frac{CD}{OD} = \\frac{CD}{OA + AD}$$\n$$\\mathbf{\\tan\\theta = \\frac{Q\\sin\\alpha}{P + Q\\cos\\alpha}}$$\n$$\\mathbf{\\theta = \\tan^{-1}\\left(\\frac{Q\\sin\\alpha}{P + Q\\cos\\alpha}\\right)}$$\n\n> **লব্ধির দিক সংক্রান্ত সোনালি নিয়ম:**\n> লব্ধি $R$ যার সাথে $\\theta$ কোণ তৈরি করবে (এখানে $P$), সে হরে একাকী বসে থাকবে। আর অপর ভেক্টরটি ($Q$) উপরে $\\sin\\alpha$ এবং নিচে $\\cos\\alpha$ নিয়ে গুণ থাকবে।\n> যদি লব্ধি $Q$ ভেক্টরের সাথে $\\theta_Q$ কোণ তৈরি করে:\n> $$\\tan\\theta_Q = \\frac{P\\sin\\alpha}{Q + P\\cos\\alpha}$$\n\n---\n\n## ৭. লব্ধির বিশেষ ক্ষেত্রসমূহ (Special Cases Table)\n\n| কেস | মধ্যবর্তী কোণ ($\\alpha$) | $\\cos\\alpha$ ও $\\sin\\alpha$ | লব্ধির মান ($R$) | লব্ধির দিক ($\\theta$) | ভৌত তাৎপর্য |\n| :---: | :---: | :---: | :---: | :---: | :--- |\n| **১. একই দিকে (সমরেখ)** | $\\alpha = 0^\\circ$ | $\\cos 0^\\circ = 1$<br>$\\sin 0^\\circ = 0$ | $\\mathbf{R_{\\max} = P + Q}$ | $\\theta = 0^\\circ$ | লব্ধির মান সর্বোচ্চ হয়। |\n| **২. বিপরীত দিকে** | $\\alpha = 180^\\circ$ | $\\cos 180^\\circ = -1$<br>$\\sin 180^\\circ = 0$ | $\\mathbf{R_{\\min} = \\|P - Q\\|}$ | $\\theta = 0^\\circ$ (বৃহত্তর বলের দিকে) | লব্ধির মান সর্বনিম্ন হয়। |\n| **৩. পরস্পর লম্বভাবে** | $\\alpha = 90^\\circ$ | $\\cos 90^\\circ = 0$<br>$\\sin 90^\\circ = 1$ | $\\mathbf{R = \\sqrt{P^2 + Q^2}}$ | $\\tan\\theta = \\frac{Q}{P}$ | সমকোণে ক্রিয়ারত পিথাগোরাস কেস। |\n| **৪. সমান মানের ভেক্টর** | $P = Q$ | যেকোনো $\\alpha$ | $\\mathbf{R = 2P\\cos\\left(\\frac{\\alpha}{2}\\right)}$ | $\\theta = \\frac{\\alpha}{2}$ | লব্ধি মধ্যবর্তী কোণকে সমদ্বিখণ্ডিত করে। |\n| **৫. লব্ধি ক্ষুদ্রতর বলের ওপর লম্ব** | $\\theta = 90^\\circ$ ($P$-এর ওপর) | $\\tan 90^\\circ = \\infty$ | $\\mathbf{R = \\sqrt{Q^2 - P^2}}$ | $\\cos\\alpha = -\\frac{P}{Q}$ | এখানে অবশ্যই $Q > P$ হতে হবে। |\n\n### প্রমাণ: সমান মানের ভেক্টরের ক্ষেত্রে $R = 2P\\cos(\\alpha/2)$\n$$R = \\sqrt{P^2 + P^2 + 2P^2\\cos\\alpha} = \\sqrt{2P^2(1 + \\cos\\alpha)}$$\nত্রিকোণমিতিক সূত্রমতে $1 + \\cos\\alpha = 2\\cos^2(\\alpha/2)$\n$$R = \\sqrt{2P^2 \\cdot 2\\cos^2(\\alpha/2)} = \\sqrt{4P^2\\cos^2(\\alpha/2)} = \\mathbf{2P\\cos\\left(\\frac{\\alpha}{2}\\right)}$$\n\n---\n\n## ৮. টাইপভিত্তিক সমাধানকৃত গাণিতিক সমস্যা (Worked Examples)\n\n### 📌 টাইপ ১: দ্বিমাত্রিক ও ত্রিমাত্রিক ভেক্টরের মান ও একক ভেক্টর\n**সমস্যা ১:** একটি ৩D ভেক্টর $\\vec{P} = 2\\hat{i} - 3\\hat{j} + 6\\hat{k}$ দেওয়া আছে।\n১. ভেক্টরটির পরম মান $|\\vec{P}|$ কত?\n২. $\\vec{P}$-এর দিক বরাবর একক ভেক্টর $\\hat{p}$ নির্ণয় করো।\n\n**সমাধান:**\n- **ধাপ ১ (সহগ চিহ্নিতকরণ):** $P_x = 2$, $P_y = -3$, $P_z = 6$\n- **ধাপ ২ (মান নির্ণয়):**\n  $$|\\vec{P}| = \\sqrt{(2)^2 + (-3)^2 + (6)^2} = \\sqrt{4 + 9 + 36} = \\sqrt{49} = \\mathbf{7\\text{ একক}}$$\n- **ধাপ ৩ (একক ভেক্টর):**\n  $$\\hat{p} = \\frac{\\vec{P}}{|\\vec{P}|} = \\frac{2\\hat{i} - 3\\hat{j} + 6\\hat{k}}{7} = \\mathbf{\\frac{2}{7}\\hat{i} - \\frac{3}{7}\\hat{j} + \\frac{6}{7}\\hat{k}}$$\n\n---\n\n### 📌 টাইপ ২: দুটি বিন্দুর স্থানাঙ্ক থেকে সরণ ভেক্টর\n**সমস্যা ২:** ত্রিমাত্রিক স্থানে দুটি বিন্দু $A(1, 2, 3)$ এবং $B(4, 6, 8)$। সরণ ভেক্টর $\\vec{AB}$ এবং এর মান নির্ণয় করো।\n\n**সমাধান:**\n- **ধাপ ১ (সরণ ভেক্টর গঠন):**\n  $$\\vec{AB} = (x_2 - x_1)\\hat{i} + (y_2 - y_1)\\hat{j} + (z_2 - z_1)\\hat{k}$$\n  $$\\vec{AB} = (4 - 1)\\hat{i} + (6 - 2)\\hat{j} + (8 - 3)\\hat{k} = \\mathbf{3\\hat{i} + 4\\hat{j} + 5\\hat{k}}$$\n- **ধাপ ২ (মান নির্ণয়):**\n  $$|\\vec{AB}| = \\sqrt{3^2 + 4^2 + 5^2} = \\sqrt{9 + 16 + 25} = \\sqrt{50} = \\mathbf{5\\sqrt{2}\\text{ একক}}$$\n\n---\n\n### 📌 টাইপ ৩: সামান্তরিক সূত্রের সাধারণ প্রয়োগ\n**সমস্যা ৩:** $3\\text{ N}$ এবং $4\\text{ N}$ মানের দুটি বল একটি বিন্দুতে $60^\\circ$ কোণে ক্রিয়ারত। লব্ধির মান ও দিক নির্ণয় করো।\n\n**সমাধান:**\nদেওয়া আছে: $P = 3\\text{ N}$, $Q = 4\\text{ N}$, $\\alpha = 60^\\circ$\n1. **লব্ধির মান:**\n   $$R = \\sqrt{3^2 + 4^2 + 2(3)(4)\\cos 60^\\circ} = \\sqrt{9 + 16 + 24(0.5)} = \\sqrt{25 + 12} = \\sqrt{37} \\approx \\mathbf{6.08\\text{ N}}$$\n2. **লব্ধির দিক ($P$-এর সাথে কোণ):**\n   $$\\tan\\theta = \\frac{4\\sin 60^\\circ}{3 + 4\\cos 60^\\circ} = \\frac{4(0.866)}{3 + 4(0.5)} = \\frac{3.464}{5} = 0.6928$$\n   $$\\theta = \\tan^{-1}(0.6928) \\approx \\mathbf{34.71^\\circ}$$\n\n---\n\n### 📌 টাইপ ৪: দুটি সমান বল ও ১২০° কোণ\n**সমস্যা ৪:** $5\\text{ N}$ ও $5\\text{ N}$ মানের দুটি বল $120^\\circ$ কোণে ক্রিয়ারত থাকলে এদের লব্ধির মান ও দিক কত?\n\n**সমাধান:**\nযেহেতু $P = Q = 5\\text{ N}$ এবং $\\alpha = 120^\\circ$:\n$$R = 2P\\cos\\left(\\frac{\\alpha}{2}\\right) = 2(5)\\cos 60^\\circ = 10 \\times 0.5 = \\mathbf{5\\text{ N}}$$\n$$\\theta = \\frac{\\alpha}{2} = \\frac{120^\\circ}{2} = \\mathbf{60^\\circ}$$\n> **গুরুত্বপূর্ণ সিদ্ধান্ত:** দুটি সমান মানের ভেক্টর $120^\\circ$ কোণে ক্রিয়া করলে তাদের লব্ধির মান বলদ্বয়ের যেকোনো একটির মানের সমান হয়।\n\n---\n\n### 📌 টাইপ ৫: বুয়েট / এডমিশন স্পেশাল (লব্ধি ক্ষুদ্রতর বলের ওপর লম্ব)\n**সমস্যা ৫:** দুটি বলের লব্ধি ক্ষুদ্রতর বলের ওপর লম্ব এবং এর মান বৃহত্তর বলের মানের এক-তৃতীয়াংশ। বলদ্বয়ের মানের অনুপাত কত?\n\n**সমাধান:**\nধরি ক্ষুদ্রতর বল $P$ এবং বৃহত্তর বল $Q$। লব্ধি $\\vec{R} \\perp \\vec{P}$, অর্থাৎ $\\theta = 90^\\circ$।\nশর্তমতে: $R = \\frac{1}{3}Q$\nআমরা জানি, যখন লব্ধি ক্ষুদ্রতর বলের ওপর লম্ব হয়:\n$$R^2 = Q^2 - P^2$$\n$$\\left(\\frac{1}{3}Q\\right)^2 = Q^2 - P^2 \\implies \\frac{1}{9}Q^2 = Q^2 - P^2$$\n$$P^2 = Q^2 - \\frac{1}{9}Q^2 = \\frac{8}{9}Q^2 \\implies \\frac{P^2}{Q^2} = \\frac{8}{9}$$\n$$\\mathbf{\\frac{P}{Q} = \\frac{\\sqrt{8}}{3} = \\frac{2\\sqrt{2}}{3}}$$\n\n---\n\n## ৯. স্ব-মূল্যায়ন ও প্র্যাকটিস চ্যালেঞ্জ (Self-Practice Problems with Hints & Solutions)\n\n<div class=\"practice-card\">\n  <div class=\"practice-header\">\n    <span class=\"practice-badge\">প্র্যাকটিস ০১</span>\n    <h4>দিক কোসাইন ও কোণ সংক্রান্ত সমস্যা</h4>\n  </div>\n  <p><strong>প্রশ্ন:</strong> একটি ভেক্টর $\\vec{A} = 2\\hat{i} - 2\\hat{j} + \\hat{k}$।</p>\n  <ol>\n    <li>ভেক্টরটির দিক কোসাইনত্রয় $(\\cos\\alpha, \\cos\\beta, \\cos\\gamma)$ নির্ণয় করো।</li>\n    <li>ভেক্টরটি $Y$-অক্ষের সাথে কত কোণ তৈরি করে?</li>\n    <li>যাচাই করো যে $\\cos^2\\alpha + \\cos^2\\beta + \\cos^2\\gamma = 1$।</li>\n  </ol>\n  <details class=\"practice-collapse\">\n    <summary class=\"practice-summary\">💡 সমাধান ও উত্তর দেখতে ক্লিক করুন</summary>\n    <div class=\"practice-solution\">\n      <p><strong>সমাধান:</strong></p>\n      <p>ভেক্টরের মান: $A = \\sqrt{2^2 + (-2)^2 + 1^2} = \\sqrt{4 + 4 + 1} = \\sqrt{9} = 3$</p>\n      <p>১. দিক কোসাইনত্রয়:</p>\n      <ul>\n        <li>$\\cos\\alpha = \\frac{A_x}{A} = \\mathbf{\\frac{2}{3}}$</li>\n        <li>$\\cos\\beta = \\frac{A_y}{A} = \\mathbf{-\\frac{2}{3}}$</li>\n        <li>$\\cos\\gamma = \\frac{A_z}{A} = \\mathbf{\\frac{1}{3}}$</li>\n      </ul>\n      <p>২. $Y$-অক্ষের সাথে কোণ $\\beta = \\cos^{-1}\\left(-\\frac{2}{3}\\right) = \\mathbf{131.81^\\circ}$</p>\n      <p>৩. $\\cos^2\\alpha + \\cos^2\\beta + \\cos^2\\gamma = \\left(\\frac{2}{3}\\right)^2 + \\left(-\\frac{2}{3}\\right)^2 + \\left(\\frac{1}{3}\\right)^2 = \\frac{4}{9} + \\frac{4}{9} + \\frac{1}{9} = \\frac{9}{9} = 1$ (যাচাইকৃত)।</p>\n    </div>\n  </details>\n</div>\n\n<div class=\"practice-card\">\n  <div class=\"practice-header\">\n    <span class=\"practice-badge\">প্র্যাকটিস ০২</span>\n    <h4>সমান বলদ্বয়ের লব্ধি ও মধ্যবর্তী কোণ</h4>\n  </div>\n  <p><strong>প্রশ্ন:</strong> দুটি সমান মানের বল একটি বিন্দুতে ক্রিয়াশীল। এদের লব্ধির বর্গ বলদ্বয়ের গুণফলের ৩ গুণ হলে বলদ্বয়ের মধ্যবর্তী কোণ কত?</p>\n  <details class=\"practice-collapse\">\n    <summary class=\"practice-summary\">💡 সমাধান ও উত্তর দেখতে ক্লিক করুন</summary>\n    <div class=\"practice-solution\">\n      <p><strong>সমাধান:</strong></p>\n      <p>ধরি, বলদ্বয় $P = Q$ এবং মধ্যবর্তী কোণ $\\alpha$।</p>\n      <p>প্রশ্নমতে: $R^2 = 3(P \\times Q) = 3P^2$</p>\n      <p>সামান্তরিক সূত্র থেকে: $R^2 = P^2 + P^2 + 2P^2\\cos\\alpha = 2P^2(1 + \\cos\\alpha)$</p>\n      <p>অতএব, $2P^2(1 + \\cos\\alpha) = 3P^2 \\implies 1 + \\cos\\alpha = \\frac{3}{2} \\implies \\cos\\alpha = \\frac{1}{2}$</p>\n      <p>$\\mathbf{\\alpha = \\cos^{-1}(0.5) = 60^\\circ}$ (উত্তর)</p>\n    </div>\n  </details>\n</div>\n\n<div class=\"practice-card\">\n  <div class=\"practice-header\">\n    <span class=\"practice-badge\">প্র্যাকটিস ০৩</span>\n    <h4>সর্বোচ্চ ও সর্বনিম্ন লব্ধি থেকে কোণ নির্ণয় (BUET Standard)</h4>\n  </div>\n  <p><strong>প্রশ্ন:</strong> কোনো বিন্দুতে ক্রিয়ারত দুটি বলের সর্বোচ্চ লব্ধি $17\\text{ N}$ এবং সর্বনিম্ন লব্ধি $7\\text{ N}$। বলদ্বয় যদি পরস্পর সমকোণে ($90^\\circ$) ক্রিয়া করে, তবে লব্ধির মান কত হবে?</p>\n  <details class=\"practice-collapse\">\n    <summary class=\"practice-summary\">💡 সমাধান ও উত্তর দেখতে ক্লিক করুন</summary>\n    <div class=\"practice-solution\">\n      <p><strong>সমাধান:</strong></p>\n      <p>আমরা জানি: $P + Q = 17$ এবং $P - Q = 7$</p>\n      <p>যোগ করে: $2P = 24 \\implies P = 12\\text{ N}$</p>\n      <p>বিয়োগ করে: $2Q = 10 \\implies Q = 5\\text{ N}$</p>\n      <p>সমকোণে ক্রিয়ারত হলে লব্ধি:</p>\n      <p>$\\mathbf{R = \\sqrt{P^2 + Q^2} = \\sqrt{12^2 + 5^2} = \\sqrt{144 + 25} = \\sqrt{169} = 13\\text{ N}}$ (উত্তর)</p>\n    </div>\n  </details>\n</div>\n" },
            { id: "p1_c2_m2", title: "মডিউল ০২: উপাংশ বিভাজন ও মেকানিক্স", duration: "২০ মিনিট", tag: "বলবিদ্যা", md: "# পদার্থবিজ্ঞান ১ম পত্র — অধ্যায় ২: ভেক্টর | মডিউল ০২: ভেক্টরের উপাংশ বিভাজন, লম্বাংশের উপপাদ্য ও মেকানিক্স\n\n---\n\n## ১. ভেক্টরের বিভাজন ও উপাংশের মূল ধারণা\n\n### ১.১ বাস্তব জীবনের উদাহরণ (ট্রলি ব্যাগের মেকানিক্স)\nতুমি যখন স্টেশনে একটি ভারী চাকাযুক্ত ট্রলি ব্যাগ টেনে নিয়ে যাও, তখন হ্যান্ডেল ধরে কোণাকুণি (তির্যকভাবে) ওপরের দিকে বল $F$ প্রয়োগ করো। কিন্তু ব্যাগটি শূন্যে উড়ে যায় না, বরং মাটির সমান্তরালে সোজা সামনে এগিয়ে যায়।\n\nএখানে তোমার প্রযুক্ত একক তির্যক বলটি ভেতরে ভেতরে একই সাথে দুটি স্বতন্ত্র কাজের জন্ম দেয়:\n1. বলের একটি অংশ ব্যাগকে মাটির সমান্তরালে সোজা সামনে টেনে নিয়ে যায় (**অনুভূমিক উপাংশ**)।\n2. বলের আরেকটি অংশ ব্যাগকে ওপরের দিকে তুলে মাটি থেকে কিছুটা হালকা করে (**উলম্ব উপাংশ**)।\n\n```\n                  F sin θ ↑   ↗ F (প্রযুক্ত টান বল)\n                          │  /\n                          │ / θ\n        ──────────────────•──────────────────► F cos θ (সামনে নেওয়ার কার্যকর বল)\n                          │\n                          ↓ W = mg (ব্যাগের প্রকৃত ওজন)\n```\n\n- **ভেক্টরের বিভাজন (Resolution of Vectors):** একটি ভেক্টর রাশিকে দুই বা ততোধিক রাশিতে বিভক্ত করার প্রক্রিয়াকে ভেক্টরের বিভাজন বলে।\n- **উপাংশ (Components):** বিভক্ত অংশগুলোর প্রত্যেকটিকে মূল ভেক্টরের উপাংশ বলা হয়।\n\n---\n\n## ২. যেকোনো কোণে ভেক্টর বিভাজন (Non-orthogonal Resolution)\n\nযখন কোনো ভেক্টরকে এমন দুটি দিকে বিভক্ত করতে হয় যা পরস্পর সমকোণে ($90^\\circ$) নেই।\n\n```\n                         Y ▲\n                          /\n                         /   . C\n                     Y  /   /\n                       /   /  R⃗ (মূল ভেক্টর)\n                      / β /\n                     O───┴───────────► X (১ম উপাংশ)\n                           α\n```\n\n### ২.১ কোণের পরিচয়\n- মূল ভেক্টর = $\\vec{R}$\n- ১ম উপাংশ = $\\vec{X}$, যা মূল ভেক্টর $\\vec{R}$-এর সাথে $\\alpha$ কোণে ক্রিয়ারত।\n- ২য় উপাংশ = $\\vec{Y}$, যা মূল ভেক্টর $\\vec{R}$-এর সাথে $\\beta$ কোণে ক্রিয়ারত।\n- $X$ ও $Y$ উপাংশদ্বয়ের মধ্যবর্তী মোট কোণ $= (\\alpha + \\beta)$।\n\n### ২.২ সাইন সূত্র (Sine Rule) দিয়ে গাণিতিক প্রমাণ\nত্রিভুজ সূত্রানুসারে $\\vec{X}$ এবং $\\vec{Y}$ উপাংশদ্বয়ের ভেক্টর যোগফল $\\vec{R}$। অতএব, $X$, $Y$ এবং $R$ বাহু তিনটি দ্বারা একটি ত্রিভুজ $\\triangle OAC$ গঠিত হয়, যার তিনটি কোণ:\n- $\\angle AOC = \\alpha$ ($Y$ বাহুর বিপরীত কোণ)\n- $\\angle ACO = \\beta$ ($X$ বাহুর বিপরীত কোণ)\n- $\\angle OAC = 180^\\circ - (\\alpha + \\beta)$ ($R$ বাহুর বিপরীত কোণ)\n\nত্রিকোণমিতির সাইন সূত্র অনুযায়ী:\n$$\\frac{\\text{বাহুর দৈর্ঘ্য}}{\\text{বিপরীত কোণের সাইন}} = \\text{ধ্রুবক}$$\n$$\\frac{X}{\\sin\\beta} = \\frac{Y}{\\sin\\alpha} = \\frac{R}{\\sin(180^\\circ - (\\alpha + \\beta))} = \\frac{R}{\\sin(\\alpha + \\beta)}$$\n\nঅতএব, উপাংশদ্বয়ের মান:\n$$\\mathbf{X = \\frac{R\\sin\\beta}{\\sin(\\alpha + \\beta)}}$$\n$$\\mathbf{Y = \\frac{R\\sin\\alpha}{\\sin(\\alpha + \\beta)}}$$\n\n> **মনে রাখার কৌশল:**\n> $X$ উপাংশ নির্ণয়ের সময় লবে বিপরীত দিকের কোণ ($\\beta$)-এর সাইন বসে।\n> $Y$ উপাংশ নির্ণয়ের সময় লবে বিপরীত দিকের কোণ ($\\alpha$)-এর সাইন বসে।\n> এবং হরে সর্বদা উভয় কোণের সমষ্টির সাইন $\\sin(\\alpha + \\beta)$ থাকে।\n\n---\n\n## ৩. পরস্পর লম্ব উপাংশে বিভাজন (Orthogonal Resolution)\n\n```\n                Y ▲\n                  │          C (x, y)\n                  │         /│\n                  │        / │\n              Y⃗  │    R⃗  /  │ Y = R sin α\n                  │      /   │\n                  │     /α   │\n                  O────┴─────┴──────► X\n                   X = R cos α\n```\n\n### ৩.১ সূত্র প্রতিপাদন\nযখন দুটি উপাংশ পরস্পর সমকোণে ($90^\\circ$) থাকে, তখন $\\alpha + \\beta = 90^\\circ \\implies \\beta = 90^\\circ - \\alpha$।\nসাধারণ সূত্রে মান বসিয়ে:\n$$X = \\frac{R\\sin(90^\\circ - \\alpha)}{\\sin 90^\\circ} = \\frac{R\\cos\\alpha}{1} = \\mathbf{R\\cos\\alpha}$$\n$$Y = \\frac{R\\sin\\alpha}{\\sin 90^\\circ} = \\frac{R\\sin\\alpha}{1} = \\mathbf{R\\sin\\alpha}$$\n\n### ৩.২ 🔑 সোনালি মাস্টার রুল\n> **\"কোণ ($\\theta$) যে অক্ষের সাথে যুক্ত থাকবে, সেদিকে উপাংশ হবে $\\cos\\theta$; এবং তার লম্ব দিকে উপাংশ হবে $\\sin\\theta$।\"**\n\n| কোণ কার সাথে দেওয়া আছে | অনুভূমিক উপাংশ ($F_x$) | উলম্ব উপাংশ ($F_y$) |\n| :--- | :---: | :---: |\n| **অনুভূমিকের সাথে $\\theta$ কোণ** | $\\mathbf{F\\cos\\theta}$ | $\\mathbf{F\\sin\\theta}$ |\n| **উলম্বের সাথে $\\theta$ কোণ (ট্র্যাপ!)** | $\\mathbf{F\\sin\\theta}$ | $\\mathbf{F\\cos\\theta}$ |\n\n---\n\n## ৪. উপাংশের বাস্তব প্রয়োগ ও গতিবিজ্ঞান (Real-World Applications)\n\n### 🚜 ৪.১ লন রোলার — টানা সহজ কিন্তু ঠেলা কঠিন কেন?\nরোলারের ভর $m$, তাই তার প্রকৃত ওজন $W = mg$ সর্বদা খাড়া নিচের দিকে ক্রিয়া করে।\n\n```\n        (ক) লন রোলার টানা (Pulling)                (খ) লন রোলার ঠেলা (Pushing)\n            F sin θ ↑   ↗ F (টানা বল)                    F cos θ\n                    │  /                               ─────────────•─────────────►\n                    │ / θ                                           │        ─────────────•─────────────► F cos θ                        │  \\ θ\n                    │                                               │   ↘ F (ঠেলা বল)\n                    │ W = mg (নিচের দিকে)                            ↓ F sin θ\n                                                                    ↓ W = mg\n```\n\n#### কেস ১: বল অনুভূমিকের সাথে $\theta$ কোণে প্রযুক্ত হলে\n- **টানার সময় (Pulling):**\n  - উলম্ব উপাংশ $F\\sin\\theta$ ওপরের দিকে কাজ করে ওজনকে হালকা করে।\n  - আপাত ওজন: $\\mathbf{W_{pull} = mg - F\\sin\\theta}$\n- **ঠেলার সময় (Pushing):**\n  - উলম্ব উপাংশ $F\\sin\\theta$ নিচের দিকে কাজ করে ওজনকে বাড়িয়ে দেয়।\n  - আপাত ওজন: $\\mathbf{W_{push} = mg + F\\sin\\theta}$\n- **আপাত ওজনের পার্থক্য:**\n  $$\\mathbf{\\Delta W = W_{push} - W_{pull} = 2F\\sin\\theta}$$\n\n#### 🚨 কেস ২: ট্র্যাপ কেস — বল উলম্বের সাথে $\theta$ কোণে প্রযুক্ত হলে!\nযদি কোণ $\\theta$ উল্লম্বের সাথে দেওয়া থাকে:\n- টানার সময় আপাত ওজন: $\\mathbf{W_{pull} = mg - F\\cos\\theta}$\n- ঠেলার সময় আপাত ওজন: $\\mathbf{W_{push} = mg + F\\cos\\theta}$\n- আপাত ওজনের পার্থক্য: $\\mathbf{\\Delta W = 2F\\cos\\theta}$\n\n---\n\n### ⛵ ৪.২ নৌকার গুণ টানা (Towing a Boat with Rope)\nনদীর তীর থেকে দড়ি বেঁধে নৌকা টেনে সামনে নিয়ে যাওয়াকে গুণ টানা বলে।\n\n```\n                নদীর তীর (Shore)\n    ───────────────────────────────────────\n             \\  θ (কোণ)\n              \\   F (দড়ির টান বল)\n                               •  নৌকা\n                ├───► Fx = F cos θ (সামনে এগিয়ে নেওয়ার কার্যকর বল)\n                │\n                ↓ Fy = F sin θ (নৌকাকে তীরের দিকে টেনে আনার বল)\n```\n\n- **অনুভূমিক উপাংশ ($F_x = F\\cos\\theta$):** নৌকাকে নদীর দৈর্ঘ্য বরাবর সোজা সামনের দিকে এগিয়ে নিয়ে যায়।\n- **উলম্ব উপাংশ ($F_y = F\\sin\\theta$):** নৌকাকে তীরের দিকে আছড়ে ফেলতে চায়। মাঝিরা হালের সাহায্যে এই উপাংশকে নিষ্ক্রিয় (Cancel) করেন।\n- **দড়ি যত লম্বা করা হয়, নৌকা টানা তত সহজ হয় কেন?**\n  - দড়ির দৈর্ঘ্য বৃদ্ধি পেলে তীরের সাথে দড়ির কোণ $\\theta$ ছোট হয় ($\theta \\downarrow$)।\n  - কোণ $\\theta$ কমলে $\\cos\\theta$-র মান বৃদ্ধি পায় ($\\cos\\theta \\uparrow$), ফলে সামনে এগিয়ে নেওয়ার কার্যকর বল $\\mathbf{F\\cos\\theta}$ বৃদ্ধি পায়।\n  - একই সাথে ক্ষতিকর উপাংশ $F\\sin\\theta$ হ্রাস পায়।\n  - তাই দড়ি যত লম্বা হবে, গুণ টেনে নৌকা চালানো তত দ্রুত ও সহজ হবে।\n\n---\n\n### 🕊️ ৪.৩ পাখির ডানা ঝাপটানো ও আকাশে ওড়া\nপাখি যখন আকাশে ওড়ে, তখন তার দুটি ডানা দিয়ে বায়ুর ওপর তির্যকভাবে পেছনের দিকে বল $F_1$ ও $F_2$ প্রয়োগ করে।\n- নিউটনের ৩য় সূত্রানুসারে বায়ু পাখির ডানার ওপর সমান ও বিপরীতমুখী প্রতিক্রিয়া বল $R_1$ ও $R_2$ প্রয়োগ করে।\n- প্রতিক্রিয়া বলগুলোর উলম্ব উপাংশ $R\\sin\\theta$ পাখির ওজনকে প্রশমিত করে আকাশে ভাসিয়ে রাখে।\n- প্রতিক্রিয়া বলগুলোর অনুভূমিক উপাংশ $2R\\cos\\theta$ পাখিকে দ্রুত সামনের দিকে উড়ে যেতে সাহায্য করে।\n\n---\n\n## ৫. লম্বাংশের উপপাদ্য (Law of Components)\n\n### ৫.১ বিবৃতি\n> যেকোনো নির্দিষ্ট দিক বরাবর সমতলীয় কতগুলো ভেক্টরের উপাংশের বীজগণিতীয় যোগফল, ওই নির্দিষ্ট দিক বরাবর এদের লব্ধির উপাংশের সমান।\n\n### ৫.২ গাণিতিক সমাধানের ৪টি ধাপ\nধরা যাক, $F_1, F_2, F_3, \\dots$ বলসমূহ $X$-অক্ষের সাথে যথাক্রমে $\\theta_1, \\theta_2, \\theta_3, \\dots$ কোণে ক্রিয়ারত।\n1. **$X$-অক্ষ বরাবর মোট উপাংশ:**\n   $$R_x = \\sum F_x = F_1\\cos\\theta_1 + F_2\\cos\\theta_2 + F_3\\cos\\theta_3 + \\dots$$\n2. **$Y$-অক্ষ বরাবর মোট উপাংশ:**\n   $$R_y = \\sum F_y = F_1\\sin\\theta_1 + F_2\\sin\\theta_2 + F_3\\sin\\theta_3 + \\dots$$\n3. **একক লব্ধির মান ($R$):**\n   $$\\mathbf{R = \\sqrt{R_x^2 + R_y^2}}$$\n4. **লব্ধির দিক ($\\theta$):**\n   $$\\mathbf{\\theta = \\tan^{-1}\\left(\\frac{R_y}{R_x}\\right)}$$\n\n---\n\n## ৬. ল্যামির উপপাদ্য (Lami's Theorem)\n\n```\n                     P\n                     ↑\n                     │\n          γ        . │ .       β\n                 .   │   .\n               .     │     .\n             Q ──────•────── R\n                   α\n```\n\n### ৬.১ উপপাদ্যের বিবৃতি\n> কোনো বিন্দুতে একই সমতলে ক্রিয়ারত তিনটি ভেক্টর বল যদি বস্তুকে সাম্যাবস্থায় (Equilibrium) রাখে, তবে প্রতিটি বলের মান অপর দুটি বলের মধ্যবর্তী কোণের সাইনের (Sine) সমানুপাতিক।\n\n### ৬.২ গাণিতিক সমীকরণ\n$$\\mathbf{\\frac{P}{\\sin\\alpha} = \\frac{Q}{\\sin\\beta} = \\frac{R}{\\sin\\gamma}}$$\n- $P$-এর বিপরীত কোণ = $Q$ ও $R$-এর মধ্যবর্তী কোণ ($\\alpha$)\n- $Q$-এর বিপরীত কোণ = $P$ ও $R$-এর মধ্যবর্তী কোণ ($\\beta$)\n- $R$-এর বিপরীত কোণ = $P$ ও $Q$-এর মধ্যবর্তী কোণ ($\\gamma$)\n\n---\n\n## ৭. সমাধানকৃত গাণিতিক সমস্যা ও বোর্ড সিকিউ (Worked CQ Problems)\n\n### 📌 সমস্যা ১: লন রোলার বোর্ড সিকিউ (উলম্ব কোণ ট্র্যাপ)\n**প্রশ্ন:** $15\\text{ kg}$ ভরের একটি লন রোলারকে উলম্বের সাথে $30^\\circ$ কোণে $98\\text{ N}$ বল প্রয়োগ করে একজন মালী প্রথমে ঠেললেন এবং পরে একই বলে টানলেন ($g = 9.8\\text{ m/s}^2$)।\n(গ) লন রোলারটিকে টানার সময় এর আপাত ওজন কত হবে?\n(ঘ) মালী রোলারটিকে ঠেলার বদলে টেনে নেওয়া সুবিধাজনক মনে করলেন কেন?—গাণিতিকভাবে বিশ্লেষণ করো।\n\n**সমাধান:**\n- **প্রদত্ত মান:** $m = 15\\text{ kg}$, $W = mg = 15 \\times 9.8 = 147\\text{ N}$, $F = 98\\text{ N}$, উলম্বের সাথে কোণ $\\theta = 30^\\circ$\n- **(গ) টানার সময় আপাত ওজন:**\n  যেহেতু কোণ উলম্বের সাথে, উলম্ব উপাংশ $= F\\cos 30^\\circ = 98 \\times 0.866 = 84.87\\text{ N}$\n  $$W_{pull} = W - F\\cos 30^\\circ = 147 - 84.87 = \\mathbf{62.13\\text{ N}}$$\n- **(ঘ) ঠেলার সময় আপাত ওজন ও তুলনা:**\n  $$W_{push} = W + F\\cos 30^\\circ = 147 + 84.87 = \\mathbf{231.87\\text{ N}}$$\n  সামনে নেওয়ার বল উভয় ক্ষেত্রে সমান ($F_x = F\\sin 30^\\circ = 49\\text{ N}$)।\n  আপাত ওজনের পার্থক্য $\\Delta W = 231.87 - 62.13 = \\mathbf{169.74\\text{ N}}$।\n  ঠেলার সময় মেঝেতে চাপ $169.74\\text{ N}$ বেশি হওয়ায় ঘর্ষণ বল মারাত্মক বৃদ্ধি পায়, ফলে ঠেলে নেওয়া কঠিন কিন্তু টেনে নেওয়া সুবিধাজনক।\n\n---\n\n### 📌 সমস্যা ২: লম্বাংশের উপপাদ্যে বহু-বলের লব্ধি\n**প্রশ্ন:** একটি বিন্দুতে তিনটি বল ক্রিয়ারত: $F_1 = 10\\text{ N}$ ($0^\\circ$), $F_2 = 20\\text{ N}$ ($60^\\circ$), $F_3 = 15\\text{ N}$ ($120^\\circ$)। লব্ধির মান ও দিক নির্ণয় করো।\n\n**সমাধান:**\n- $R_x = 10\\cos 0^\\circ + 20\\cos 60^\\circ + 15\\cos 120^\\circ = 10(1) + 20(0.5) + 15(-0.5) = \\mathbf{12.5\\text{ N}}$\n- $R_y = 10\\sin 0^\\circ + 20\\sin 60^\\circ + 15\\sin 120^\\circ = 0 + 20(0.866) + 15(0.866) = \\mathbf{30.31\\text{ N}}$\n- লব্ধির মান: $R = \\sqrt{(12.5)^2 + (30.31)^2} = \\sqrt{156.25 + 918.70} = \\sqrt{1074.95} \\approx \\mathbf{32.78\\text{ N}}$\n- লব্ধির দিক: $\\theta = \\tan^{-1}\\left(\\frac{30.31}{12.5}\\right) = \\tan^{-1}(2.4248) \\approx \\mathbf{67.58^\\circ}$\n\n---\n\n## ৫. স্ব-মূল্যায়ন ও প্র্যাকটিস চ্যালেঞ্জ (Mechanics Practice Problems)\n\n<div class=\"practice-card\">\n  <div class=\"practice-header\">\n    <span class=\"practice-badge\">প্র্যাকটিস ০১</span>\n    <h4>লন রোলারের ঠেলা বনাম টানার ওজন পার্থক্য</h4>\n  </div>\n  <p><strong>প্রশ্ন:</strong> $20\\text{ kg}$ ভরের একটি লন রোলারকে অণুভূমিকের সাথে $30^\\circ$ কোণে $50\\text{ N}$ বল প্রয়োগ করে ঠেলা হলো এবং একই বলে টানা হলো।</p>\n  <ol>\n    <li>ঠেলা ও টানার ক্ষেত্রে রোলারের কার্যকর ওজন কত হবে? ($g = 9.8\\text{ ms}^{-2}$)</li>\n    <li>উভয় ক্ষেত্রে কার্যকর ওজনের পার্থক্য কত?</li>\n  </ol>\n  <details class=\"practice-collapse\">\n    <summary class=\"practice-summary\">💡 সমাধান ও উত্তর দেখতে ক্লিক করুন</summary>\n    <div class=\"practice-solution\">\n      <p><strong>সমাধান:</strong></p>\n      <p>প্রকৃত ওজন $W = mg = 20 \\times 9.8 = 196\\text{ N}$</p>\n      <p>উল্লম্ব উপাংশ $F\\sin\\theta = 50\\sin 30^\\circ = 50 \\times 0.5 = 25\\text{ N}$</p>\n      <ul>\n        <li><strong>ঠেলার ক্ষেত্রে ওজন:</strong> $W_{push} = W + F\\sin\\theta = 196 + 25 = \\mathbf{221\\text{ N}}$</li>\n        <li><strong>টানার ক্ষেত্রে ওজন:</strong> $W_{pull} = W - F\\sin\\theta = 196 - 25 = \\mathbf{171\\text{ N}}$</li>\n        <li><strong>ওজনের পার্থক্য:</strong> $\\Delta W = 2F\\sin\\theta = 2(25) = \\mathbf{50\\text{ N}}$ (উত্তর)</li>\n      </ul>\n    </div>\n  </details>\n</div>\n\n<div class=\"practice-card\">\n  <div class=\"practice-header\">\n    <span class=\"practice-badge\">প্র্যাকটিস ০২</span>\n    <h4>ল্যামির উপপাদ্যের সাম্যাবস্থা প্রয়োগ</h4>\n  </div>\n  <p><strong>প্রশ্ন:</strong> একটি বিন্দুতে তিনটি বল $P, Q, R$ সাম্যাবস্থায় রয়েছে। $P$ ও $Q$-এর মধ্যবর্তী কোণ $120^\\circ$ এবং $Q$ ও $R$-এর মধ্যবর্তী কোণ $150^\\circ$। বলত্রয়ের মানের অনুপাত $P : Q : R$ কত?</p>\n  <details class=\"practice-collapse\">\n    <summary class=\"practice-summary\">💡 সমাধান ও উত্তর দেখতে ক্লিক করুন</summary>\n    <div class=\"practice-solution\">\n      <p><strong>সমাধান:</strong></p>\n      <p>৩য় কোণ ( $P$ ও $R$-এর মধ্যবর্তী কোণ) $= 360^\\circ - (120^\\circ + 150^\\circ) = 360^\\circ - 270^\\circ = 90^\\circ$</p>\n      <p>ল্যামির উপপাদ্য অনুসারে:</p>\n      $$\\frac{P}{\\sin 150^\\circ} = \\frac{Q}{\\sin 90^\\circ} = \\frac{R}{\\sin 120^\\circ}$$\n      $$\\frac{P}{0.5} = \\frac{Q}{1} = \\frac{R}{\\frac{\\sqrt{3}}{2}} \\implies P : Q : R = 0.5 : 1 : 0.866 = \\mathbf{1 : 2 : \\sqrt{3}}$$\n    </div>\n  </details>\n</div>\n" },
            { id: "p1_c2_h1", title: "💡 স্পেশাল গাইড: উপাংশ ও ল্যামির উপপাদ্য", duration: "১৫ মিনিট", tag: "সহায়ক হ্যান্ডনোট", md: "# ভেক্টরের উপাংশ, লম্বাংশের উপপাদ্য ও ল্যামির উপপাদ্য\n### (একদম গোড়া থেকে সহজ ব্যাখ্যা + বাস্তব উদাহরণ + ভর্তি পরীক্ষার সমাধান)\n\n---\n\n## ০. আগে মূল ধারণাটা বুঝে নিই (গল্পের মাধ্যমে)\n\n**একটা বলকে ঠিক কতটা কাজে লাগছে?**\n\nধরো তুমি একটা ভারী স্কুলব্যাগ (ট্রলি ব্যাগ) টেনে নিচ্ছ। হাতলটা ওপরের দিকে হেলানো, তাই তুমি তির্যকভাবে (কোনাকুনি) টানছ। কিন্তু ব্যাগ যাচ্ছে সামনের দিকে।\n\nতাহলে তোমার টানের একটা অংশ ব্যাগকে **সামনে** নিচ্ছে, আর আরেকটা অংশ ব্যাগকে **ওপরে** তুলতে চাইছে। একটা বল যেন দুটো আলাদা কাজ করছে।\n\n> **এই \"একটা তির্যক বলকে দুটো সোজা বলে ভেঙে দেখা\"-ই হলো ভেক্টরের বিভাজন।**\n> ভাঙা অংশ দুটোকে বলে **উপাংশ**।\n\n**কেন ভাঙি?** তির্যক বল নিয়ে হিসাব করা কঠিন। কিন্তু সামনের দিকের বল আর ওপরের দিকের বল আলাদা আলাদা হলে হিসাব সোজা হয়ে যায়। পুরো পদার্থবিজ্ঞানের মেকানিক্স এই কৌশলের ওপর দাঁড়িয়ে।\n\n---\n\n## ১. ভেক্টরের বিভাজন ও উপাংশ\n\n- **বিভাজন (Resolution):** একটা ভেক্টরকে দুই বা ততোধিক ভেক্টরে ভাঙা।\n- **উপাংশ (Component):** ভাঙার পর পাওয়া প্রতিটি অংশ।\n- উপাংশগুলোকে আবার যোগ করলে (ভেক্টর যোগ) হুবহু মূল ভেক্টরই ফিরে আসে।\n\nদুই ধরনের বিভাজন আছে:\n1. **যেকোনো কোণে বিভাজন** (উপাংশ দুটো পরস্পর লম্ব নয়)\n2. **লম্ব বিভাজন** (উপাংশ দুটো ৯০° কোণে) — এটাই ৯০% প্রশ্নে লাগে\n\n---\n\n## ২. যেকোনো কোণে বিভাজন (Non-orthogonal)\n\n### পরিস্থিতি\nমূল ভেক্টর $\\vec R$-কে ভাঙতে হবে $\\vec X$ ও $\\vec Y$ এই দুই দিকে, যারা পরস্পর লম্ব নয়।\n\n- $\\vec X$ দিকটা $\\vec R$-এর সাথে $\\alpha$ কোণ করে\n- $\\vec Y$ দিকটা $\\vec R$-এর সাথে $\\beta$ কোণ করে\n- তাহলে $X$ ও $Y$ দিকের মধ্যে কোণ $= \\alpha + \\beta$\n\n### প্রমাণ (সাইন সূত্র দিয়ে)\n\nত্রিভুজ সূত্রে $\\vec X$ আর $\\vec Y$ যোগ করলে $\\vec R$ পাওয়া যায়, অর্থাৎ $X$, $Y$, $R$ মিলে একটা ত্রিভুজ হয়। এই ত্রিভুজের কোণ তিনটি:\n- $R$ ও $X$-এর মাঝের কোণ $= \\alpha$ ($Y$ বাহুর বিপরীত কোণ)\n- $R$ ও $Y$-এর মাঝের কোণ $= \\beta$ ($X$ বাহুর বিপরীত কোণ)\n- তৃতীয় কোণ $= 180^\\circ - (\\alpha+\\beta)$ ($R$ বাহুর বিপরীত কোণ)\n\nসাইন সূত্র: **বাহু ÷ বিপরীত কোণের সাইন = ধ্রুবক**\n\n$$\\frac{X}{\\sin\\beta}=\\frac{Y}{\\sin\\alpha}=\\frac{R}{\\sin(180^\\circ-(\\alpha+\\beta))}=\\frac{R}{\\sin(\\alpha+\\beta)}$$\n\n(কারণ $\\sin(180^\\circ-\\theta)=\\sin\\theta$)\n\n$$\\boxed{X=\\frac{R\\sin\\beta}{\\sin(\\alpha+\\beta)}}\\qquad\\boxed{Y=\\frac{R\\sin\\alpha}{\\sin(\\alpha+\\beta)}}$$\n\n**মনে রাখার কৌশল:** $X$-এর সূত্রে ওপরে **অপর কোণ** ($\\beta$)-এর সাইন বসে। $Y$-এর সূত্রে ওপরে $\\alpha$-এর সাইন বসে। অর্থাৎ **উল্টো কোণের সাইন**।\n\n### উদাহরণ\n$100\\ \\text{N}$ বলকে এমন দুই দিকে ভাঙতে হবে যেখানে $X$ দিকটা বলের সাথে $30^\\circ$ আর $Y$ দিকটা $45^\\circ$ কোণে।\n\n$\\alpha=30^\\circ,\\ \\beta=45^\\circ,\\ \\alpha+\\beta=75^\\circ,\\ \\sin75^\\circ=0.9659$\n\n$$X=\\frac{100\\times\\sin45^\\circ}{0.9659}=\\frac{70.71}{0.9659}=73.2\\ \\text{N}$$\n$$Y=\\frac{100\\times\\sin30^\\circ}{0.9659}=\\frac{50}{0.9659}=51.76\\ \\text{N}$$\n\n**যাচাই:** $R$-এর দিক বরাবর উপাংশগুলো যোগ করলে $73.2\\cos30^\\circ+51.76\\cos45^\\circ=63.4+36.6=100$ ✓\n\n---\n\n## ৩. লম্ব বিভাজন (৯০° কোণে) — সবচেয়ে গুরুত্বপূর্ণ\n\n### সূত্র প্রমাণ\nউপাংশ দুটো লম্ব হলে $\\alpha+\\beta=90^\\circ$, তাই $\\beta=90^\\circ-\\alpha$। সাধারণ সূত্রে বসাই:\n\n$$X=\\frac{R\\sin(90^\\circ-\\alpha)}{\\sin90^\\circ}=R\\cos\\alpha,\\qquad Y=\\frac{R\\sin\\alpha}{\\sin 90^\\circ}=R\\sin\\alpha$$\n\n### সহজ ত্রিভুজ দিয়ে মনে রাখা\nএকটা সমকোণী ত্রিভুজ আঁকো, যার কর্ণ = বল $R$।\n- কোণটার **লাগোয়া বাহু** = $R\\cos(\\text{কোণ})$\n- কোণটার **বিপরীত বাহু** = $R\\sin(\\text{কোণ})$\n\n### 🔑 সোনালি নিয়ম: **\"কোণ যে অক্ষের সাথে, সেই অক্ষের দিকে cos; অন্যদিকে sin\"**\n\n| কোণ কার সাথে দেওয়া | অনুভূমিক উপাংশ | উলম্ব উপাংশ |\n|---|---|---|\n| **অনুভূমিকের** সাথে $\\theta$ | $F\\cos\\theta$ | $F\\sin\\theta$ |\n| **উলম্বের** সাথে $\\theta$ | $F\\sin\\theta$ | $F\\cos\\theta$ |\n\n### বাস্তব উদাহরণ ১: ঘুড়ির সুতা 🪁\nঘুড়ির সুতায় টান $50\\ \\text{N}$, সুতা মাটির (অনুভূমিক) সাথে $60^\\circ$ কোণে।\n- অনুভূমিক উপাংশ (ঘুড়িকে বাতাসের দিকে টানে) $=50\\cos60^\\circ=25\\ \\text{N}$\n- উলম্ব উপাংশ (ঘুড়িকে ওপরে ধরে রাখে) $=50\\sin60^\\circ=43.3\\ \\text{N}$\n\n### বাস্তব উদাহরণ ২: ঢালু তলে বস্তু (খুব গুরুত্বপূর্ণ) ⛰️\n$10\\ \\text{kg}$ ভরের বাক্স $30^\\circ$ ঢালু কাঠের তক্তায় রাখা। $g=9.8$।\n\nওজন $W=mg=98\\ \\text{N}$ সবসময় **খাড়া নিচে**। কিন্তু ঢালের দিকে চিন্তা করলে ওজনকে ঢাল বরাবর আর ঢালের লম্ব বরাবর ভাঙতে হয়। ঢালের কোণ $\\theta$ হলে ওজন ও ঢালের লম্বের মধ্যবর্তী কোণও $\\theta$।\n- ঢাল বরাবর নিচে নামানোর বল $=mg\\sin\\theta=98\\times0.5=49\\ \\text{N}$\n- ঢালের লম্ব বরাবর (তলে চাপ দেয়) $=mg\\cos\\theta=98\\times0.866=84.87\\ \\text{N}$\n\nএই কারণেই ঢাল খাড়া হলে ($\\theta$ বাড়লে) বাক্স দ্রুত পিছলে নামে, কারণ $\\sin\\theta$ বাড়ে।\n\n---\n\n## ৪. লম্বাংশের উপপাদ্য (Law of Components) — অনেকগুলো ভেক্টরের লব্ধি\n\n### সমস্যাটা কী?\nএকটা বস্তুকে তিন-চারজন মিলে তিন-চার দিক থেকে টানছে। এই সবার মিলিত ফল (লব্ধি) কত এবং কোন দিকে?\n\n### উপপাদ্য (কথায়)\n> যেকোনো দিকে সবগুলো বলের উপাংশের **বীজগণিতীয় যোগফল** = লব্ধির ওই দিকের উপাংশ।\n\nসহজ ভাষায়: **আগে সবাইকে $x$ আর $y$ দিকে ভাঙো। $x$-গুলো যোগ করো, $y$-গুলো যোগ করো। তারপর ওই দুই যোগফল থেকে লব্ধি বের করো।**\n\n### সূত্র\nবলগুলো $F_1,F_2,F_3,\\dots$, প্রতিটি $x$-অক্ষের ধনাত্মক দিক থেকে ঘড়ির কাঁটার **বিপরীতে** $\\theta_1,\\theta_2,\\theta_3,\\dots$ কোণে।\n\n$$R_x=F_1\\cos\\theta_1+F_2\\cos\\theta_2+F_3\\cos\\theta_3+\\cdots=\\sum F_x$$\n$$R_y=F_1\\sin\\theta_1+F_2\\sin\\theta_2+F_3\\sin\\theta_3+\\cdots=\\sum F_y$$\n\n**লব্ধির মান:** (বর্গ করে যোগ করলে $\\cos^2+\\sin^2=1$ হয়)\n$$R=\\sqrt{R_x^2+R_y^2}$$\n\n**লব্ধির দিক:** ($R_y$-কে $R_x$ দিয়ে ভাগ করলে)\n$$\\tan\\theta=\\frac{R_y}{R_x}\\ \\Rightarrow\\ \\theta=\\tan^{-1}\\!\\left(\\frac{R_y}{R_x}\\right)$$\n\n### ⚠️ তিনটি অবশ্য পালনীয় নিয়ম\n1. কোণ সবসময় **$x$-অক্ষের ধনাত্মক দিক (পূর্ব) থেকে ঘড়ির কাঁটার বিপরীতে** মাপো।\n2. $\\cos$ আর $\\sin$ যে চিহ্ন দেয় তা **সংখ্যার মধ্যেই** থাকতে দাও (যেমন $\\cos120^\\circ=-0.5$)। আলাদা করে চিহ্ন ভাবার দরকার নেই।\n3. **$\\theta$-র চতুর্ভাগ (quadrant) ঠিক করা** (এই ভুলটা সবচেয়ে বেশি হয়):\n\n| $R_x$ | $R_y$ | লব্ধি কোথায় | প্রকৃত কোণ |\n|---|---|---|---|\n| + | + | ১ম চতুর্ভাগ | $\\theta'=\\tan^{-1}\\left|R_y/R_x\\right|$ |\n| − | + | ২য় | $180^\\circ-\\theta'$ |\n| − | − | ৩য় | $180^\\circ+\\theta'$ |\n| + | − | ৪র্থ | $360^\\circ-\\theta'$ (বা $-\\theta'$) |\n\nক্যালকুলেটর শুধু $\\pm90^\\circ$-এর মধ্যে উত্তর দেয়। তাই $R_x,R_y$-এর চিহ্ন দেখে নিজেই ঠিক চতুর্ভাগ বসাতে হবে।\n\n### বাস্তব উদাহরণ: টাগ অব ওয়ার নয়, তিন বন্ধু মিলে গাড়ি ঠেলছে 🚗\nতিনজন একটা বিকল গাড়িকে তিন দিক থেকে ঠেলছে। কে কোথা থেকে কতটুকু ঠেলছে হিসাব করলে গাড়িটা শেষ পর্যন্ত কোন দিকে কত জোরে যাবে, সেটাই এই উপপাদ্যে বের হয়।\n\n### সমাধান করা উদাহরণ ১ (সরল)\n$30\\ \\text{N}$ পূর্বে আর $40\\ \\text{N}$ উত্তরে। লব্ধি কত?\n\n$R_x=30,\\ R_y=40$\n$R=\\sqrt{900+1600}=50\\ \\text{N}$, $\\ \\theta=\\tan^{-1}(4/3)=53.13^\\circ$\n\n### সমাধান করা উদাহরণ ২ (তিনটি বল)\n$F_1=10\\ \\text{N}$ ($0^\\circ$), $F_2=20\\ \\text{N}$ ($60^\\circ$), $F_3=15\\ \\text{N}$ ($120^\\circ$)\n\n$$R_x=10\\cos0^\\circ+20\\cos60^\\circ+15\\cos120^\\circ=10+10-7.5=12.5\\ \\text{N}$$\n$$R_y=0+20\\sin60^\\circ+15\\sin120^\\circ=17.32+12.99=30.31\\ \\text{N}$$\n$$R=\\sqrt{12.5^2+30.31^2}=\\sqrt{156.25+918.7}=\\sqrt{1074.95}\\approx32.78\\ \\text{N}$$\n$$\\theta=\\tan^{-1}\\frac{30.31}{12.5}=\\tan^{-1}(2.4248)\\approx67.58^\\circ$$\n\n$R_x,R_y$ দুটোই ধনাত্মক, তাই ১ম চতুর্ভাগ, কোণ ঠিক আছে।\n\n### সমাধান করা উদাহরণ ৩ (চতুর্ভাগ বদলে যাওয়া ফাঁদ)\n$F_1=10\\ \\text{N}$ ($0^\\circ$), $F_2=10\\ \\text{N}$ ($135^\\circ$), $F_3=10\\ \\text{N}$ ($270^\\circ$)\n\n$$R_x=10+10\\cos135^\\circ+10\\cos270^\\circ=10-7.07+0=2.93$$\n$$R_y=0+10\\sin135^\\circ+10\\sin270^\\circ=7.07-10=-2.93$$\n$$R=\\sqrt{2.93^2+2.93^2}=4.14\\ \\text{N}$$\n$\\tan\\theta'=1\\Rightarrow\\theta'=45^\\circ$। এখানে $R_x>0,\\ R_y<0$, তাই **৪র্থ চতুর্ভাগ**, প্রকৃত কোণ $=360^\\circ-45^\\circ=315^\\circ$ (অর্থাৎ পূর্ব থেকে ৪৫° দক্ষিণ-মুখী)।\n\n---\n\n## ৫. ল্যামির উপপাদ্য (Lami's Theorem)\n\n### কোন পরিস্থিতিতে ব্যবহার করব?\nনিচের **তিনটি শর্ত** একসাথে মিললে:\n1. ঠিক **তিনটি** বল\n2. সবাই **একই বিন্দুতে** কাজ করছে এবং **একই সমতলে**\n3. বস্তুটি **সাম্যাবস্থায়** আছে (স্থির, বা সমবেগে চলছে)\n\nসাম্যাবস্থা মানে তিন বলের লব্ধি শূন্য। যেমন ছাদ থেকে দুই দড়িতে ঝোলানো ল্যাম্প। তিনটি বল হলো দুই দড়ির টান আর ল্যাম্পের ওজন।\n\n### উপপাদ্য\nপ্রতিটি বলের মান ওই বলের **বিপরীত কোণের সাইনের** সমানুপাতিক। বিপরীত কোণ মানে অপর দুই বলের মধ্যবর্তী কোণ।\n\n$$\\boxed{\\frac{P}{\\sin\\alpha}=\\frac{Q}{\\sin\\beta}=\\frac{R}{\\sin\\gamma}}$$\n\n- $\\alpha$ = $Q$ ও $R$-এর মধ্যকার কোণ ($P$-এর বিপরীতে)\n- $\\beta$ = $P$ ও $R$-এর মধ্যকার কোণ ($Q$-এর বিপরীতে)\n- $\\gamma$ = $P$ ও $Q$-এর মধ্যকার কোণ ($R$-এর বিপরীতে)\n- তিন কোণের যোগফল $\\alpha+\\beta+\\gamma=360^\\circ$ (বলগুলো একই বিন্দু ঘিরে)\n\n### উৎস (সংক্ষেপে বুঝে নাও)\nসাম্যাবস্থায় তিন বল দিয়ে মাথা-থেকে-লেজ করে সাজালে একটা **বদ্ধ ত্রিভুজ** হয়। ত্রিভুজের কোণগুলো হয় $180^\\circ-\\alpha$ ইত্যাদি। সাইন সূত্র প্রয়োগ করলে $\\sin(180^\\circ-\\alpha)=\\sin\\alpha$ হওয়ায় ল্যামির সূত্র বেরিয়ে আসে।\n\n### ⚠️ সবচেয়ে বড় ভুল: কোণ বসানো\nকোণ হতে হবে **দুই বলের ক্রিয়ারেখার মধ্যকার কোণ, যখন তিন বলের তীরচিহ্ন সবগুলো বিন্দু থেকে বাইরে আঁকা হয়**। \"দড়ি ও ছাদের কোণ\" সরাসরি বসিয়ে দিলে ভুল হবে। সবসময় **দুই বলের তীরের মধ্যকার কোণ** বের করো।\n\n### সমাধান করা উদাহরণ ১ (প্রতিসম, ল্যাম্প ঝোলানো) 💡\n$100\\ \\text{N}$ ওজনের ল্যাম্প দুটো সমান দড়িতে ঝুলছে, প্রতিটি দড়ি উলম্বের সাথে $30^\\circ$ কোণে।\n\nকোণ নির্ণয়:\n- দুই দড়ির টানের মধ্যে কোণ $=30^\\circ+30^\\circ=60^\\circ$ (ওজনের বিপরীত কোণ)\n- প্রতি দড়ির টান ও ওজনের মধ্যে কোণ $=180^\\circ-30^\\circ=150^\\circ$\n\nল্যামি: $\\dfrac{T}{\\sin150^\\circ}=\\dfrac{100}{\\sin60^\\circ}$\n\n$$T=\\frac{100\\times0.5}{0.866}=57.7\\ \\text{N}$$\n\n**যাচাই (লম্বাংশ দিয়ে):** উলম্বে $2T\\cos30^\\circ=2\\times57.7\\times0.866=100$ ✓ (দেখো, দড়িতে টান ওজনের চেয়েও কম, কারণ দুই দড়ি ভাগ করে নিচ্ছে।)\n\n### সমাধান করা উদাহরণ ২ (অপ্রতিসম)\n$100\\ \\text{N}$ ওজন দুটো দড়িতে ঝুলছে। দড়ি দুটি অনুভূমিক ছাদের সাথে $30^\\circ$ ও $60^\\circ$ কোণে।\n\nকোণ:\n- $T_1$ (ছাদের সাথে $30^\\circ$) ও $T_2$ (ছাদের সাথে $60^\\circ$)-এর মধ্যকার কোণ $=180^\\circ-30^\\circ-60^\\circ=90^\\circ$\n- $T_1$ ও ওজন $W$-এর মধ্যে কোণ $=90^\\circ+30^\\circ=120^\\circ$\n- $T_2$ ও $W$-এর মধ্যে কোণ $=90^\\circ+60^\\circ=150^\\circ$\n\nল্যামি: $\\dfrac{T_1}{\\sin150^\\circ}=\\dfrac{T_2}{\\sin120^\\circ}=\\dfrac{100}{\\sin90^\\circ}$\n\n$$T_1=100\\times0.5=50\\ \\text{N},\\qquad T_2=100\\times0.866=86.6\\ \\text{N}$$\n\n**যাচাই:**\n- অনুভূমিক: $T_1\\cos30^\\circ=43.3$, $T_2\\cos60^\\circ=43.3$ ✓\n- উলম্ব: $T_1\\sin30^\\circ+T_2\\sin60^\\circ=25+75=100$ ✓\n\n### ল্যামি নাকি লম্বাংশ, কোনটা কখন?\n| পরিস্থিতি | ব্যবহার করো |\n|---|---|\n| ঠিক ৩টি বল, সাম্যাবস্থা, কোণ জানা | ল্যামি (দ্রুততম) |\n| ৩-এর বেশি বল, বা সাম্যাবস্থা নয় | লম্বাংশ |\n| লব্ধি চাইছে | লম্বাংশ |\n| ল্যামিতে আটকে গেলে | $\\sum F_x=0,\\ \\sum F_y=0$ (লম্বাংশ) দিয়ে সমাধান |\n\n---\n\n## ৬. বাস্তব প্রয়োগ ১: লন রোলার টানা সহজ, ঠেলা কঠিন কেন? 🚜\n\n### প্রথমে মূল ধারণা (আপাত ওজন)\nলন রোলারের নিজের ওজন $W=mg$ (খাড়া নিচে)। তুমি $F$ বলে টানো বা ঠেলো, বলটা তির্যক, তাই **উলম্ব উপাংশ** আছে।\n\n- **টানলে:** $F$ ওপরের দিকে হেলানো, তাই উলম্ব উপাংশ $F\\sin\\theta$ ওপরে ওঠায়। রোলার একটু \"হালকা\" হয়ে যায়।\n  $$W_{pull}=mg-F\\sin\\theta$$\n- **ঠেললে:** $F$ নিচের দিকে হেলানো, তাই উলম্ব উপাংশ নিচে চাপ দেয়। রোলার \"ভারী\" হয়।\n  $$W_{push}=mg+F\\sin\\theta$$\n- দুই অবস্থার পার্থক্য $\\Delta W=2F\\sin\\theta$।\n\n**দুই ক্ষেত্রেই সামনের দিকে কার্যকর বল $F\\cos\\theta$ (একই)।** তাই পার্থক্যটা শুধু ঘর্ষণে।\n\n### কেন ঘর্ষণ বদলায়?\nঘর্ষণ বল $f=\\mu N$, যেখানে $N$ = মেঝের প্রতিক্রিয়া (আপাত ওজন)। টানলে $N$ কম, তাই ঘর্ষণ কম। ঠেললে $N$ বেশি, তাই ঘর্ষণ বেশি।\n\n### 🚨 ফাঁদ: কোণ কার সাথে?\n| কোণ কার সাথে | উলম্ব উপাংশ | $\\Delta W$ |\n|---|---|---|\n| অনুভূমিকের সাথে $\\theta$ | $F\\sin\\theta$ | $2F\\sin\\theta$ |\n| **উলম্বের সাথে $\\theta$** | $F\\cos\\theta$ | $2F\\cos\\theta$ |\n\n### সমাধান করা উদাহরণ (উলম্বের সাথে কোণ)\n$20\\ \\text{kg}$ রোলার, $F=100\\ \\text{N}$, বল **উলম্বের সাথে $60^\\circ$**, $g=9.8$।\n\n$W=20\\times9.8=196\\ \\text{N}$; উলম্ব উপাংশ $=100\\cos60^\\circ=50\\ \\text{N}$\n\n- $W_{pull}=196-50=146\\ \\text{N}$\n- $W_{push}=196+50=246\\ \\text{N}$\n- $\\Delta W=100\\ \\text{N}$\n\n(উলম্বের সাথে $60^\\circ$ মানে অনুভূমিকের সাথে $30^\\circ$। $100\\sin30^\\circ=50$, একই ফল।)\n\n### ঘর্ষণসহ বাস্তব যাচাই\nধরো $\\mu=0.5$ এবং একই রোলার। সামনে টানার কার্যকর বল $F_x=100\\sin60^\\circ=86.6\\ \\text{N}$ (কারণ কোণ উলম্বের সাথে)।\n\n- টানলে: $f=0.5\\times146=73\\ \\text{N}$। $86.6>73$, তাই **রোলার চলে** ✓\n- ঠেললে: $f=0.5\\times246=123\\ \\text{N}$। $86.6<123$, তাই **রোলার নড়ে না** ✗\n\nএকই বল দিয়ে একটা চলে, আরেকটা চলে না। এটাই টানা-ঠেলার পার্থক্য।\n\n**একই নিয়মের আরও উদাহরণ:** ভারী স্লেজ বা শিশুর স্লেজগাড়ি টানা সহজ, ঠেলা কঠিন। ঠেলার সময় নিচের দিকে চাপ বাড়ে।\n\n---\n\n## ৭. বাস্তব প্রয়োগ ২: নৌকার গুণ টানা ⛵\n\nনদীর পাড় থেকে দড়ি বেঁধে নৌকা টেনে এগিয়ে নেওয়াকে গুণ টানা বলে। দড়ি তীরের সাথে কোণ $\\theta$ করে থাকে।\n\nদড়ির টান $F$-কে ভাঙি:\n1. **$F\\cos\\theta$ (নদীর দৈর্ঘ্য বরাবর):** নৌকাকে সামনে এগিয়ে নেয়। **এটাই কাজের অংশ।**\n2. **$F\\sin\\theta$ (তীরের দিকে লম্ব):** নৌকাকে তীরের দিকে টেনে নিতে চায়। **এটা ক্ষতিকর।** মাঝি হাল বা বৈঠা দিয়ে উল্টো বল দিয়ে এটা কাটিয়ে দেয়।\n\n### দড়ি যত লম্বা, টানা তত সহজ কেন?\nদড়ি লম্বা হলে নৌকা তীর থেকে দূরে থাকলেও দড়ির কোণ $\\theta$ ছোট হয় (কারণ দড়ি প্রায় নদীর সমান্তরাল হয়ে আসে)।\n- $\\theta\\downarrow\\ \\Rightarrow\\ \\cos\\theta\\uparrow$: কাজের বল বাড়ে\n- $\\theta\\downarrow\\ \\Rightarrow\\ \\sin\\theta\\downarrow$: ক্ষতিকর বল কমে\n\n### সংখ্যা দিয়ে দেখি\n$F=200\\ \\text{N}$।\n\n| কোণ $\\theta$ | $F\\cos\\theta$ (সামনে) | $F\\sin\\theta$ (তীরমুখী) |\n|---|---|---|\n| $30^\\circ$ (ছোট দড়ি) | $173.2\\ \\text{N}$ | $100\\ \\text{N}$ |\n| $10^\\circ$ (লম্বা দড়ি) | $196.96\\ \\text{N}$ | $34.73\\ \\text{N}$ |\n\nএকই বলে লম্বা দড়িতে সামনের বল বেশি এবং তীরমুখী ক্ষতি অনেক কম।\n\n### একই নীতির বাস্তব উদাহরণ\n- **ট্রলি ব্যাগের হাতল লম্বা রাখা হয় কেন?** লম্বা হাতলে $\\theta$ ছোট হয়, তাই $F\\cos\\theta$ বাড়ে। $40\\ \\text{N}$ বলে $\\theta=30^\\circ$ হলে সামনে $34.64\\ \\text{N}$, আর হাতল ছোট হয়ে $\\theta=60^\\circ$ হলে মাত্র $20\\ \\text{N}$।\n- **বোঝা টানা:** কুলি বা রিকশাচালক দড়ি/হাতল যতটা সম্ভব অনুভূমিকের কাছে রাখে।\n\n---\n\n## ৮. আরও কিছু বাস্তব প্রয়োগ (পরীক্ষায় আসে)\n\n**ক. ক্রিকেট বা ফুটবল কিক (প্রাসের বেগ):** $20\\ \\text{m/s}$ বেগে বল $30^\\circ$ কোণে ছোড়া।\n- অনুভূমিক বেগ $v_x=20\\cos30^\\circ=17.32\\ \\text{m/s}$ (এটা কমে না)\n- উলম্ব বেগ $v_y=20\\sin30^\\circ=10\\ \\text{m/s}$ (মাধ্যাকর্ষণে বদলায়)\n\nএই ভাঙাটা ছাড়া প্রাসের অঙ্ক হয়ই না।\n\n**খ. নৌকা ও নদীর স্রোত:** নৌকার বেগকে স্রোত বরাবর ও স্রোতের লম্বে ভেঙে হিসাব করা হয়।\n\n**গ. পাল-তোলা নৌকা:** বাতাসের বলকে পালের লম্ব ও সমান্তরালে ভাঙা হয়।\n\n**ঘ. ফ্যানের ব্লেড, ঘুড়ি, বিমানের ডানা:** সব জায়গায় তির্যক বলকে ওপর-সামনে ভেঙে বোঝা হয়।\n\n---\n\n## ৯. পরীক্ষায় সাধারণ ভুলের তালিকা ❌➜✅\n\n| ভুল | সঠিক |\n|---|---|\n| সবসময় অনুভূমিকে $\\cos$, উলম্বে $\\sin$ বসিয়ে দেওয়া | **কোণ কার সাথে সেটা আগে দেখো।** উলম্বের সাথে হলে উল্টে যায় |\n| উপাংশ যোগ করার সময় $R=R_x+R_y$ লেখা | $R=\\sqrt{R_x^2+R_y^2}$ |\n| ল্যামিতে কোণ হিসাবে \"দড়ি-ছাদের কোণ\" বসানো | দুই বলের **তীরের মধ্যকার কোণ** বসাও |\n| $\\tan^{-1}$ থেকে সরাসরি কোণ নেওয়া (চতুর্ভাগ না দেখে) | $R_x,R_y$-এর চিহ্ন দেখে চতুর্ভাগ ঠিক করো |\n| লম্বাংশে ভেক্টরের কোণ ঘড়ির কাঁটার দিকে মাপা | ঘড়ির কাঁটার **বিপরীতে** |\n| আপাত ওজন: টানা ও ঠেলা উল্টে ফেলা | টানা $=mg-F\\sin\\theta$, ঠেলা $=mg+F\\sin\\theta$ |\n| ঢালে $mg\\sin\\theta$ আর $mg\\cos\\theta$ গুলিয়ে ফেলা | ঢাল **বরাবর** $\\sin\\theta$, ঢালের **লম্ব বরাবর** $\\cos\\theta$ |\n| ক্যালকুলেটর radian মোডে রাখা | পরীক্ষার আগে **DEG** মোড দেখে নাও |\n\n---\n\n## ১০. এক নজরে সব সূত্র (Formula Sheet)\n\n**বিভাজন (যেকোনো কোণ):**\n$X=\\dfrac{R\\sin\\beta}{\\sin(\\alpha+\\beta)},\\quad Y=\\dfrac{R\\sin\\alpha}{\\sin(\\alpha+\\beta)}$\n\n**লম্ব বিভাজন:**\n- অনুভূমিকের সাথে $\\theta$: $F_x=F\\cos\\theta,\\ F_y=F\\sin\\theta$\n- উলম্বের সাথে $\\theta$: $F_x=F\\sin\\theta,\\ F_y=F\\cos\\theta$\n\n**লম্বাংশের উপপাদ্য:**\n$R_x=\\sum F\\cos\\theta_i,\\quad R_y=\\sum F\\sin\\theta_i,\\quad R=\\sqrt{R_x^2+R_y^2},\\quad \\tan\\theta=\\dfrac{R_y}{R_x}$\n\n**ল্যামি:** $\\dfrac{P}{\\sin\\alpha}=\\dfrac{Q}{\\sin\\beta}=\\dfrac{R}{\\sin\\gamma}$\n\n**লন রোলার:** $W_{pull}=mg-F\\sin\\theta,\\ W_{push}=mg+F\\sin\\theta,\\ \\Delta W=2F\\sin\\theta$ (উলম্বের সাথে কোণ হলে $\\sin\\to\\cos$)\n\n**ঢালু তল:** ঢাল বরাবর $mg\\sin\\theta$, লম্ব বরাবর $mg\\cos\\theta$\n\n**গুণ টানা:** কার্যকর $=F\\cos\\theta$, ক্ষতিকর $=F\\sin\\theta$; দড়ি লম্বা $\\Rightarrow\\theta\\downarrow$ $\\Rightarrow$ টানা সহজ\n\n**কিছু মান:**\n\n| $\\theta$ | $0^\\circ$ | $30^\\circ$ | $37^\\circ$ | $45^\\circ$ | $53^\\circ$ | $60^\\circ$ | $90^\\circ$ |\n|---|---|---|---|---|---|---|---|\n| $\\sin\\theta$ | 0 | 0.5 | 0.6 | 0.707 | 0.8 | 0.866 | 1 |\n| $\\cos\\theta$ | 1 | 0.866 | 0.8 | 0.707 | 0.6 | 0.5 | 0 |\n\n---\n\n## ১১. নিজে করো (উত্তরসহ)\n\n**প্রশ্ন ১.** $200\\ \\text{N}$ বল অনুভূমিকের সাথে $37^\\circ$ কোণে ($\\sin37^\\circ\\approx0.6$)। উপাংশ দুটি কত?\n> **উত্তর:** $F_x=200\\times0.8=160\\ \\text{N}$, $F_y=200\\times0.6=120\\ \\text{N}$\n\n**প্রশ্ন ২.** $10\\ \\text{kg}$ ভরের স্লেজকে অনুভূমিকের সাথে $30^\\circ$ কোণে $50\\ \\text{N}$ বলে (ক) টানা (খ) ঠেলা হলো। $g=10$। আপাত ওজন কত?\n> **উত্তর:** $W=100\\ \\text{N}$, $F\\sin30^\\circ=25\\ \\text{N}$। (ক) $75\\ \\text{N}$, (খ) $125\\ \\text{N}$।\n\n**প্রশ্ন ৩.** $50\\ \\text{N}$ ওজন দুটো সমান দড়িতে ঝুলছে, প্রতিটি দড়ি ছাদের সাথে $45^\\circ$ কোণে। প্রতি দড়ির টান কত?\n> **উত্তর:** উলম্বে $2T\\sin45^\\circ=50\\Rightarrow T=\\dfrac{50}{\\sqrt2}=35.36\\ \\text{N}$। (ল্যামিতে: দুই টানের মধ্যে কোণ $90^\\circ$, প্রতিটি ও ওজনের মধ্যে $135^\\circ$, $T=50\\sin135^\\circ/\\sin90^\\circ=35.36$ ✓)\n\n**প্রশ্ন ৪.** $3\\ \\text{N}$ ($0^\\circ$), $4\\ \\text{N}$ ($90^\\circ$) — লব্ধি কত?\n> **উত্তর:** $R=5\\ \\text{N}$, $\\theta=53.13^\\circ$\n\n**প্রশ্ন ৫.** $20\\ \\text{m/s}$ বেগে $30^\\circ$ কোণে বল ছোড়া হলো। $v_x$ ও $v_y$ কত?\n> **উত্তর:** $v_x=17.32\\ \\text{m/s}$, $v_y=10\\ \\text{m/s}$\n\n**প্রশ্ন ৬.** $20\\ \\text{N}$ ($0^\\circ$), $20\\ \\text{N}$ ($120^\\circ$), $20\\ \\text{N}$ ($240^\\circ$) — লব্ধি কত?\n> **উত্তর:** $R_x=20-10-10=0$, $R_y=0+17.32-17.32=0$, তাই **লব্ধি $=0$** (তিনটি সমান বল $120^\\circ$ ব্যবধানে সাম্যাবস্থা তৈরি করে)।\n\n**প্রশ্ন ৭.** $60\\ \\text{kg}$ ভরের বাক্স $37^\\circ$ ঢালে রাখা ($g=10$)। ঢাল বরাবর নিচে নামানোর বল কত?\n> **উত্তর:** $mg\\sin37^\\circ=600\\times0.6=360\\ \\text{N}$\n\n---\n\n## ১২. সমস্যা সমাধানের ৫-ধাপ ছক (যেকোনো প্রশ্নে কাজে লাগবে)\n\n1. **ছবি আঁকো।** সব বল তীর দিয়ে দেখাও এবং কোণ চিহ্নিত করো।\n2. **কোণ কার সাথে** (অনুভূমিক নাকি উলম্ব) তা লাল কালিতে দাগ দাও।\n3. **অক্ষ ঠিক করো** ($x$ ও $y$) এবং প্রতিটি বল $x,y$-তে ভাঙো।\n4. **সাম্যাবস্থা হলে** $\\sum F_x=0$, $\\sum F_y=0$ বা ল্যামি। **লব্ধি চাইলে** $R_x,R_y$ বের করে $R,\\theta$ নাও।\n5. **যাচাই করো:** উত্তরটা যুক্তিসঙ্গত কি না, একক ঠিক আছে কি না, চতুর্ভাগ ঠিক আছে কি না।\n" },
