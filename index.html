            { id: "p1_c2_m3", title: "মডিউল ০৩: নদী-নৌকা ও BUET কেস", duration: "৩০ মিনিট", tag: "অ্যাডমিশন", md: "# পদার্থবিজ্ঞান ১ম পত্র — অধ্যায় ২: ভেক্টর | মডিউল ০৩: নদী-নৌকার গতিবিদ্যা, লব্ধি বেগ ও BUET স্পেশাল কেস\n\n---\n\n## ১. নদী-নৌকা সিস্টেমের মৌলিক স্থানাঙ্ক কাঠামো ও উপাংশ বিশ্লেষণ\n\n```\n                                      Y ▲ (নদীর প্রস্থ d)\n       ─────────────────────────────────┼─────────────────────────────── (ওপাড়)\n                                        │          ↗ w⃗ (লব্ধি বেগ)\n                                        │         /\n                                        │     v⃗  / \n                                        │       /\n                                        │      / α (যাত্রার কোণ)\n       ─────────────────────────────────•──────┴──────────────────────── (এপাড়)\n                                       O ──────► X (স্রোতের বেগ u⃗)\n```\n\n### ১.১ রাশির পরিচয়\n- $u$ = নদীর স্রোতের বেগ (সর্বদা $+X$ অক্ষ বরাবর অনুভূমিক)\n- $v$ = স্থির পানিতে নৌকার নিজস্ব বেগ / মাঝির দাঁড় টানার বেগ\n- $\\alpha$ = স্রোতের বেগের সাথে নৌকার যাত্রা শুরুর কোণ\n- $d$ = নদীর প্রকৃত প্রস্থ ($Y$-অক্ষ বরাবর উলম্ব দূরত্ব)\n- $\\vec{w}$ = নৌকা ও স্রোতের লব্ধি বেগ\n\n### ১.২ বেগের অক্ষভিত্তিক উপাংশ বিভাজন\n- **$X$-অক্ষ বরাবর (নদীর দৈর্ঘ্য বা স্রোত বরাবর) বেগ:**\n  $$v_x = u + v\\cos\\alpha$$\n- **$Y$-অক্ষ বরাবর (নদীর প্রস্থ বা পারাপার বরাবর) বেগ:**\n  $$v_y = v\\sin\\alpha$$\n\n---\n\n## ২. নদী পারাপারের সার্বজনীন সময় সূত্র (Universal Time Formula)\n\n> **মৌলিক নীতি:** নদীর প্রস্থ ($d$) হলো খাড়া উলম্ব ($Y$-অক্ষ) বরাবর দূরত্ব। সুতরাং নদী পার হতে প্রয়োজনীয় সময় নির্ভর করবে কেবল $Y$-অক্ষ বরাবর বেগের উপাংশের ($v_y = v\\sin\\alpha$) ওপর। স্রোতের বেগ ($u$) নদীর প্রস্থ পার হতে কোনো ভূমিকা রাখে না!\n\n$$\\mathbf{t = \\frac{d}{v_y} = \\frac{d}{v\\sin\\alpha}}$$\n\n### লব্ধি বেগ ($w$) ও লব্ধির দিক ($\\theta$)\n- **লব্ধি বেগ:**\n  $$\\mathbf{w = \\sqrt{u^2 + v^2 + 2uv\\cos\\alpha} = \\sqrt{v_x^2 + v_y^2}}$$\n- **স্রোতের সাথে লব্ধির কোণ ($\\theta$):**\n  $$\\mathbf{\\tan\\theta = \\frac{v\\sin\\alpha}{u + v\\cos\\alpha} \\implies \\theta = \\tan^{-1}\\left(\\frac{v\\sin\\alpha}{u + v\\cos\\alpha}\\right)}$$\n\n---\n\n## ৩. কেস ১: সর্বনিম্ন সময়ে নদী পারাপার (Shortest Time Case)\n\n```\n       ─────────────────────────────────┬─────────────────────────────── (ওপাড়)\n                                        │              ↗ w⃗\n                                        │             /\n                                      d │         v⃗  / \n                                        │           / \n                                        │          / α = 90°\n       ─────────────────────────────────•─────────┴───────────────────── (এপাড়)\n                                       O ─────────► u⃗\n                                        |◄── x ──►| (Drift)\n```\n\n### ৩.১ শর্ত ও প্রতিপাদন\nসময় $t = \\frac{d}{v\\sin\\alpha}$ সর্বনিম্ন ($t_{\\min}$) হবে যখন হরের $\\sin\\alpha$ সর্বোচ্চ হবে।\n$$\\sin\\alpha = 1 \\implies \\mathbf{\\alpha = 90^\\circ}$$\nঅর্থাৎ স্রোতের সাথে ঠিক সমকোণে ($90^\\circ$) সোজা ওপাড়ে নৌকা চালাতে হবে।\n\n### ৩.২ সূত্রাবলী\n1. **সর্বনিম্ন সময়:**\n   $$\\mathbf{t_{\\min} = \\frac{d}{v}}$$\n2. **লব্ধি বেগ:**\n   $$\\mathbf{w = \\sqrt{u^2 + v^2}}$$\n3. **পার্শ্ব সরণ / ড্রিফটিং (Drift - $x$):**\n   স্রোতের টানে নৌকাটি সোজা ওপাড়ে না গিয়ে কিছুটা ডানে সরে পৌঁছাবে:\n   $$\\mathbf{x = u \\cdot t_{\\min} = u \\left(\\frac{d}{v}\\right) = \\frac{ud}{v}}$$\n4. **অতিক্রান্ত প্রকৃত পথ ($s$):**\n   $$\\mathbf{s = \\sqrt{d^2 + x^2} = w \\cdot t_{\\min}}$$\n\n---\n\n## ৪. কেস ২: সর্বনিম্ন দূরত্বে / সোজাসুজি ওপাড়ে পৌঁছানো (Shortest Distance Case)\n\n```\n       ─────────────────────────────────▲ B (ঠিক বিপরীত বিন্দু, x = 0)\n                                        │\n                                        │ w⃗ = √(v² - u²) (লব্ধি)\n                                      d │  \n                                v⃗ ↖     │  \n                                   \\ α  │ θ = 90°\n       ─────────────────────────────•───┴─────────────────────────────── (এপাড়)\n                                   O ───► u⃗\n```\n\n### ৪.১ শর্ত ও প্রতিপাদন\nসোজাসুজি ঠিক বিপরীত বিন্দু $B$-তে পৌঁছাতে হলে পার্শ্ব সরণ বা ড্রাফট শূন্য হতে হবে ($x = 0$)।\n$$x = (u + v\\cos\\alpha)t = 0 \\implies u + v\\cos\\alpha = 0$$\n$$\\mathbf{\\cos\\alpha = -\\frac{u}{v} \\implies \\alpha = \\cos^{-1}\\left(-\\frac{u}{v}\\right) > 90^\\circ}$$\n\n> **বাস্তবতার শর্ত:** $\\cos\\alpha$ সংজ্ঞায়িত হওয়ার জন্য অবশ্যই **$\\mathbf{v > u}$ (নৌকার বেগ স্রোতের বেগের চেয়ে বেশি)** হতে হবে!\n\n### ৪.২ সূত্রাবলী\n1. **প্রয়োজনীয় যাত্রার কোণ:**\n   $$\\mathbf{\\alpha = 90^\\circ + \\sin^{-1}\\left(\\frac{u}{v}\\right) = \\cos^{-1}\\left(-\\frac{u}{v}\\right)}$$\n2. **লব্ধি বেগ (পিথাগোরাস সমকোণী ত্রিভুজ থেকে):**\n   $$\\mathbf{w = \\sqrt{v^2 - u^2}}$$\n3. **নদী পার হতে প্রয়োজনীয় সময়:**\n   $$\\mathbf{t = \\frac{d}{w} = \\frac{d}{\\sqrt{v^2 - u^2}}}$$\n4. **সর্বনিম্ন দূরত্ব:**\n   $$\\mathbf{s_{\\min} = d}$$\n\n---\n\n## ৫. কেস ৩: স্রোত নৌকার চেয়ে বেশি হলে সর্বনিম্ন ড্রাফট ($u > v$ BUET কেস)\n\nযখন স্রোতের বেগ নৌকার চেয়ে বেশি ($u > v$), তখন মাঝির পক্ষে সোজাসুজি ওপাড়ে পৌঁছানো ($x=0$) অসম্ভব। এক্ষেত্রে একটি নির্দিষ্ট কোণে চালালে পার্শ্ব সরণ বা ড্রাফট সর্বনিম্ন ($x_{\\min}$) করা যায়।\n\n### ৫.১ ক্যালকুলাস দিয়ে প্রতিপাদন\nপার্শ্ব সরণ: $x = (u + v\\cos\\alpha)t = \\frac{d(u + v\\cos\\alpha)}{v\\sin\\alpha}$\nসর্বনিম্ন সরণের শর্ত: $\\frac{dx}{d\\alpha} = 0$\n$$\\frac{d}{d\\alpha}\\left[\\frac{u + v\\cos\\alpha}{\\sin\\alpha}\\right] = 0$$\n$$\\frac{(-v\\sin\\alpha)(\\sin\\alpha) - (u + v\\cos\\alpha)(\\cos\\alpha)}{\\sin^2\\alpha} = 0$$\n$$-v\\sin^2\\alpha - u\\cos\\alpha - v\\cos^2\\alpha = 0$$\n$$-v(\\sin^2\\alpha + \\cos^2\\alpha) - u\\cos\\alpha = 0 \\implies -v - u\\cos\\alpha = 0$$\n$$\\mathbf{\\cos\\alpha = -\\frac{v}{u} \\implies \\alpha = \\cos^{-1}\\left(-\\frac{v}{u}\\right)}$$\n\n### ৫.২ সর্বনিম্ন ড্রাফটের মান\n$$\\mathbf{x_{\\min} = d \\frac{\\sqrt{u^2 - v^2}}{v}}$$\n\n---\n\n## ৬. কেস ৪: ত্বরান্বিত নদীর নৌকা (Accelerated Boat Mechanics)\n\nনৌকাটি যদি স্থির বেগ $v$-এর বদলে সুষম ত্বরণ $a$ নিয়ে $\\alpha$ কোণে যাত্রা করে:\n- $Y$-অক্ষ বরাবর ত্বরণ: $a_y = a\\sin\\alpha$\n- $Y$-অক্ষ বরাবর অতিক্রান্ত দূরত্ব:\n  $$d = v_0\\sin\\alpha \\cdot t + \\frac{1}{2}(a\\sin\\alpha)t^2$$\n- **স্থির অবস্থান থেকে যাত্রা শুরু করলে ($v_0 = 0$):**\n  $$d = \\frac{1}{2}(a\\sin\\alpha)t^2 \\implies \\mathbf{t = \\sqrt{\\frac{2d}{a\\sin\\alpha}}}$$\n\n---\n\n## ৭. কেস ৫: পুলিশ-চোর তাড়া করার সমস্যা (River Pursuit Problem)\n\n```\n                চোরের দৌড়ের দিক ───► w_thief\n   ───────────────────────────────────────────────── (ওপাড়)\n                                  ▲ (এখানে ধরা পড়বে)\n                                 /\n                   l   w (লব্ধি) /\n                     ↖          /\n                       ↖       /\n                         ↖ α  /\n  ─────────────────────────•──────────────────────── (এপাড়)\n                 স্রোতের বেগ u⃗\n```\n\nনদীর একপাড়ে চোর পাড় বরাবর $w_{thief}$ বেগে দৌড়াচ্ছে। ওপর পাড় থেকে পুলিশ $v$ বেগে স্রোতের ($u$) সাথে $\\alpha$ কোণে নৌকা চালিয়ে চোরকে ধরতে চায়।\n\n### চোর ধরার শর্ত\nএকটি নির্দিষ্ট সময় $t$ পর পুলিশ চোরকে ধরতে পারবে যদি এবং কেবল যদি পাড় বরাবর চোরের সরণ ($x_{thief}$) এবং পুলিশের নৌকার পাড় বরাবর লব্ধি সরণ ($x_{police}$) হুবহু সমান হয়:\n$$x_{thief} = x_{police}$$\n$$w_{thief} \\cdot t = (u + v\\cos\\alpha) \\cdot t$$\n$$\\mathbf{w_{thief} = u + v\\cos\\alpha}$$\n$$\\mathbf{\\alpha = \\cos^{-1}\\left(\\frac{w_{thief} - u}{v}\\right)}$$\n\n---\n\n## ৮. সমাধানকৃত গাণিতিক সমস্যা (Worked Problems)\n\n### 📌 সমস্যা ১: সর্বনিম্ন সময় বনাম সর্বনিম্ন দূরত্ব\n**প্রশ্ন:** একটি নদীর প্রস্থ $500\\text{ m}$, স্রোতের বেগ $3\\text{ m/s}$ এবং নৌকার বেগ $6\\text{ m/s}$।\n১. সর্বনিম্ন সময়ে নদী পার হতে কত সময় লাগবে এবং ড্রাফট কত হবে?\n২. সোজাসুজি ওপাড়ে পৌঁছাতে মাঝিকে কোন কোণে নৌকা চালাতে হবে এবং কত সময় লাগবে?\n\n**সমাধান:**\n- **১. সর্বনিম্ন সময় ($t_{\\min}$):**\n  $$t_{\\min} = \\frac{d}{v} = \\frac{500}{6} = \\mathbf{83.33\\text{ s}}$$\n  ড্রাফট: $x = u \\cdot t_{\\min} = 3 \\times 83.33 = \\mathbf{250\\text{ m}}$\n- **২. সোজাসুজি ওপাড়ে পৌঁছানো ($x = 0$):**\n  $$\\cos\\alpha = -\\frac{u}{v} = -\\frac{3}{6} = -0.5 \\implies \\alpha = \\cos^{-1}(-0.5) = \\mathbf{120^\\circ}$$\n  লব্ধি বেগ: $w = \\sqrt{v^2 - u^2} = \\sqrt{6^2 - 3^2} = \\sqrt{27} \\approx 5.20\\text{ m/s}$\n  পারাপারের সময়: $t = \\frac{d}{w} = \\frac{500}{\\sqrt{27}} = \\mathbf{96.23\\text{ s}}$\n\n---\n\n### 📌 সমস্যা ২: $u > v$ ক্ষেত্রে সর্বনিম্ন ড্রাফট\n**প্রশ্ন:** নদীর স্রোতের বেগ $5\\text{ m/s}$, নৌকার বেগ $3\\text{ m/s}$ এবং নদীর প্রস্থ $400\\text{ m}$। সর্বনিম্ন ড্রাফটের জন্য মাঝিকে কোন কোণে নৌকা চালাতে হবে এবং সর্বনিম্ন ড্রাফট কত হবে?\n\n**সমাধান:**\n- প্রয়োজনীয় কোণ:\n  $$\\cos\\alpha = -\\frac{v}{u} = -\\frac{3}{5} = -0.6 \\implies \\alpha = \\cos^{-1}(-0.6) \\approx \\mathbf{126.87^\\circ}$$\n- সর্বনিম্ন ড্রাফট:\n  $$x_{\\min} = d \\frac{\\sqrt{u^2 - v^2}}{v} = 400 \\times \\frac{\\sqrt{5^2 - 3^2}}{3} = 400 \\times \\frac{4}{3} = \\mathbf{533.33\\text{ m}}$$\n\n---\n\n## ৫. স্ব-মূল্যায়ন ও এডমিশন প্র্যাকটিস চ্যালেঞ্জ (River & Rain Practice)\n\n<div class=\"practice-card\">\n  <div class=\"practice-header\">\n    <span class=\"practice-badge\">প্র্যাকটিস ০১</span>\n    <h4>বৃষ্টির বেগ ও সাইকেলের গতি (ছাতার কোণ)</h4>\n  </div>\n  <p><strong>প্রশ্ন:</strong> উল্লম্বভাবে $6\\text{ ms}^{-1}$ বেগে বৃষ্টি পড়ছে। একজন সাইকেল আরোহী $8\\text{ ms}^{-1}$ বেগে অনুভূমিক রাস্তায় চলছে।</p>\n  <ol>\n    <li>বৃষ্টি হতে রক্ষা পেতে তাকে উল্লম্বের সাথে কত কোণে ছাতা ধরতে হবে?</li>\n    <li>আরোহীর সাপেক্ষে বৃষ্টির আপাত লব্ধি বেগ কত অনুভূত হবে?</li>\n  </ol>\n  <details class=\"practice-collapse\">\n    <summary class=\"practice-summary\">💡 সমাধান ও উত্তর দেখতে ক্লিক করুন</summary>\n    <div class=\"practice-solution\">\n      <p><strong>সমাধান:</strong></p>\n      <p>উল্লম্বের সাথে ছাতার কোণ:</p>\n      $$\\tan\\theta = \\frac{v_{man}}{v_{rain}} = \\frac{8}{6} = 1.333 \\implies \\mathbf{\\theta = \\tan^{-1}(1.333) = 53.13^\\circ}$$\n      <p>বৃষ্টির আপেক্ষিক বেগ:</p>\n      $$v_{rel} = \\sqrt{v_{rain}^2 + v_{man}^2} = \\sqrt{6^2 + 8^2} = \\sqrt{36 + 64} = \\sqrt{100} = \\mathbf{10\\text{ ms}^{-1}}$$\n    </div>\n  </details>\n</div>\n\n<div class=\"practice-card\">\n  <div class=\"practice-header\">\n    <span class=\"practice-badge\">প্র্যাকটিস ০২</span>\n    <h4>সোজা ওপারে পৌঁছানোর জন্য কোণ ও সময়</h4>\n  </div>\n  <p><strong>প্রশ্ন:</strong> $1.5\\text{ km}$ প্রশস্ত একটি নদীতে স্রোতের বেগ $3\\text{ km/h}$। একটি নৌকা স্থির পানিতে $6\\text{ km/h}$ বেগে চলতে পারে।</p>\n  <ol>\n    <li>সোজা বিপরীত পাড়ে পৌঁছাতে নৌকাটিকে স্রোতের সাথে কত কোণে চালাতে হবে?</li>\n    <li>নদী পার হতে কত সময় লাগবে?</li>\n  </ol>\n  <details class=\"practice-collapse\">\n    <summary class=\"practice-summary\">💡 সমাধান ও উত্তর দেখতে ক্লিক করুন</summary>\n    <div class=\"practice-solution\">\n      <p><strong>সমাধান:</strong></p>\n      <p>১. কোণ $\\alpha = \\cos^{-1}\\left(-\\frac{u}{v}\\right) = \\cos^{-1}\\left(-\\frac{3}{6}\\right) = \\cos^{-1}(-0.5) = \\mathbf{120^\\circ}$</p>\n      <p>২. লব্ধি বেগ $w = \\sqrt{v^2 - u^2} = \\sqrt{6^2 - 3^2} = \\sqrt{36 - 9} = \\sqrt{27} = 3\\sqrt{3}\\text{ km/h} \\approx 5.196\\text{ km/h}$</p>\n      <p>সময় $t = \\frac{d}{w} = \\frac{1.5}{3\\sqrt{3}} = \\frac{1}{2\\sqrt{3}}\\text{ h} \\approx 0.2887\\text{ h} = \\mathbf{17.32\\text{ মিনিট}}$ (উত্তর)</p>\n    </div>\n  </details>\n</div>\n" },
            { id: "p1_c2_h2", title: "💡 স্পেশাল গাইড: নদী-নৌকা ও লব্ধি বেগ", duration: "১৫ মিনিট", tag: "সহায়ক হ্যান্ডনোট", md: "# নদী-নৌকা ও লব্ধি বেগ\n### (একদম গোড়া থেকে সহজ ব্যাখ্যা + বাস্তব উদাহরণ + ভর্তি পরীক্ষার সমাধান)\n\n> মডিউল ২-এ যা শিখেছ (উপাংশ বিভাজন) সেটাই এখানে কাজে লাগবে। নদী-নৌকার অঙ্ক আসলে **\"বেগকে $x$ আর $y$ দিকে ভাঙো\"** ছাড়া আর কিছু না।\n\n---\n\n## ০. আগে মূল ধারণাটা বুঝে নিই (গল্পের মাধ্যমে)\n\n**খেয়া নৌকার গল্প 🛶**\n\nমনে করো তুমি পদ্মা নদীর এক পাড় থেকে ঠিক সোজা উল্টোদিকে নৌকার মুখ ঘুরিয়ে বৈঠা বাইছ। কিন্তু নদীতে স্রোত আছে। স্রোত নৌকাটাকে নিচের দিকে (ভাটির দিকে) ভাসিয়ে নিয়ে যাচ্ছে। শেষে তুমি ওপারে পৌঁছালে ঠিকই, কিন্তু **সোজা উল্টোদিকের ঘাটে নয়, কিছুটা নিচে**।\n\nএখানে নৌকার আসলে **দুটো গতি একসাথে** ঘটছে:\n1. তোমার বৈঠার জোরে নৌকা নিজে নিজে চলছে (**নৌকার বেগ $v$**)\n2. স্রোত নৌকাকে ভাসিয়ে নিচ্ছে (**স্রোতের বেগ $u$**)\n\nএই দুটো বেগ ভেক্টর যোগ করলে যা পাওয়া যায় সেটাই নৌকার **আসল বেগ (লব্ধি বেগ $w$)**। তীর থেকে দেখলে নৌকাটা ঠিক এই বেগেই চলছে বলে মনে হবে।\n\n> **একটা জিনিস মনে রাখো:** নদী পার হতে কতক্ষণ লাগবে, তা নির্ভর করে শুধু **নদীর প্রস্থ বরাবর বেগের** ওপর। স্রোত সেই বেগে কোনো সাহায্য করে না, বাধাও দেয় না। স্রোত শুধু নৌকাকে পাশে সরিয়ে দেয়।\n\nএই এক লাইনের ধারণাটা বুঝলে নিচের সব সূত্র নিজেই বের করে ফেলতে পারবে।\n\n---\n\n## ১. প্রয়োজনীয় রাশি ও উপাংশ বিভাজন\n\n### রাশিগুলো\n\n| প্রতীক | মানে |\n|---|---|\n| $d$ | নদীর প্রস্থ (এক পাড় থেকে অপর পাড়ের সোজা দূরত্ব) |\n| $u$ | স্রোতের বেগ (পাড় বরাবর, ভাটির দিকে) |\n| $v$ | নৌকা বা সাঁতারুর বেগ **স্থির পানির সাপেক্ষে** (মাঝি যে বেগে বাইছে) |\n| $\\alpha$ | নৌকার মুখের দিক ও স্রোতের দিকের মধ্যকার কোণ |\n| $w$ | লব্ধি বেগ (তীর থেকে দেখা আসল বেগ) |\n\n### ⚠️ কোণের সংজ্ঞা নিয়ে সাবধান\nএই নোটে $\\alpha$ = **স্রোতের দিক (ভাটির দিক) থেকে নৌকার মুখ পর্যন্ত কোণ**।\n- $\\alpha=0^\\circ$ মানে নৌকা স্রোতের দিকেই চলছে\n- $\\alpha=90^\\circ$ মানে নৌকার মুখ সোজা ওপারের দিকে\n- $\\alpha=180^\\circ$ মানে নৌকা স্রোতের উল্টো দিকে\n\nকিছু বই বা প্রশ্নে কোণ **উজানের দিক** বা **পাড়ের লম্ব** থেকে মাপা হয়। তখন সূত্রের চিহ্ন বদলে যায়। তাই প্রশ্নে কোণ কার সাথে দেওয়া, আগে দেখে নাও এবং নিজের $\\alpha$-তে রূপান্তর করে নাও।\n\n### উপাংশ বিভাজন\n\nস্রোতকে $x$-অক্ষ (পাড় বরাবর, ভাটির দিকে) আর নদীর প্রস্থকে $y$-অক্ষ ধরি।\n\n**নৌকার বেগ $v$-কে ভাঙি:** ($\\alpha$ কোণ $x$-অক্ষের সাথে, তাই $x$-এ $\\cos$, $y$-এ $\\sin$ — মডিউল ২-এর সোনালি নিয়ম)\n- $x$ দিকে: $v\\cos\\alpha$\n- $y$ দিকে: $v\\sin\\alpha$\n\n**স্রোতের বেগ $u$:** সে পুরোটাই $x$ দিকে, $y$ দিকে তার কোনো উপাংশ নেই ($u\\cos90^\\circ=0$)।\n\n**মোট (লব্ধি) বেগের উপাংশ:**\n\n$$\\boxed{v_x=u+v\\cos\\alpha}\\qquad\\boxed{v_y=v\\sin\\alpha}$$\n\n**লব্ধি বেগের মান:** $w=\\sqrt{v_x^2+v_y^2}=\\sqrt{u^2+v^2+2uv\\cos\\alpha}$\n\n### 🔑 সোনালি নিয়ম (এটা আজীবন মনে রাখো)\n- **সময় নির্ভর করে শুধু $v_y=v\\sin\\alpha$-এর ওপর।** $t=\\dfrac{d}{v\\sin\\alpha}$\n- **ড্রিফট (পাড় বরাবর সরে যাওয়া) নির্ভর করে $v_x$ ও সময়ের ওপর।** $x=v_x\\cdot t$\n\nমানে, প্রতিটি প্রশ্নে আগে $y$ দিকের হিসাব করে সময় বের করো, তারপর সেই সময় $x$ দিকে বসিয়ে ড্রিফট বের করো।\n\n---\n\n## ২. তিনটি প্রধান কেস\n\n### 🌊 কেস ১: সোজা বিপরীত বিন্দুতে পৌঁছানো (সর্বনিম্ন দূরত্ব)\n\n**লক্ষ্য:** নদীর ঠিক উল্টোদিকের ঘাটে পৌঁছাতে হবে, একটুও সরা চলবে না।\n\n**শর্ত:** পাড় বরাবর মোট বেগ শূন্য হতে হবে, অর্থাৎ $v_x=0$।\n\n$$u+v\\cos\\alpha=0\\ \\Rightarrow\\ \\boxed{\\cos\\alpha=-\\frac{u}{v}}$$\n\n$\\cos\\alpha$ ঋণাত্মক, তাই $\\alpha>90^\\circ$। অর্থাৎ **নৌকার মুখ উজানের দিকে (স্রোতের বিপরীতে) হেলিয়ে রাখতে হবে**, যাতে $v$-এর $x$ উপাংশ স্রোতকে কাটিয়ে দেয়।\n\n**লব্ধি বেগ:** পুরো বেগ এখন শুধু $y$ দিকে। $w=v\\sin\\alpha$।\n\n$\\cos\\alpha=-u/v$ হলে $\\sin\\alpha=\\sqrt{1-u^2/v^2}$, তাই:\n\n$$\\boxed{w=\\sqrt{v^2-u^2}}\\qquad\\boxed{t=\\frac{d}{\\sqrt{v^2-u^2}}}$$\n\n**পাড়ের লম্বের সাপেক্ষে কোণ:** যদি প্রশ্নে বলে \"পাড়ের লম্ব থেকে উজানের দিকে কত ডিগ্রি হেলাতে হবে\", তাহলে $\\sin\\phi=\\dfrac{u}{v}$। (কারণ $x$ দিকে $v\\sin\\phi=u$ হয়ে স্রোতকে কাটে।) এই $\\phi=\\alpha-90^\\circ$।\n\n**শর্ত:** $v>u$ হতে হবে। নইলে $\\cos\\alpha<-1$ হয়ে যায়, যা অসম্ভব।\n\n### ⏱️ কেস ২: সবচেয়ে কম সময়ে পার হওয়া\n\n$t=\\dfrac{d}{v\\sin\\alpha}$ কম হবে যখন হরের $\\sin\\alpha$ সর্বোচ্চ, অর্থাৎ $\\sin\\alpha=1$।\n\n$$\\boxed{\\alpha=90^\\circ}\\qquad\\boxed{t_{min}=\\frac{d}{v}}$$\n\n**নৌকার মুখ সোজা ওপারের দিকে রাখতে হবে।** এ থেকে বোঝা যায়, স্রোত যত জোরেই হোক, সময়ের ওপর তার কোনো প্রভাব নেই।\n\nএই অবস্থায়:\n- **ড্রিফট (ভাটির দিকে সরে যাওয়া):** $x=u\\cdot t_{min}=\\dfrac{ud}{v}$\n- **লব্ধি বেগ:** $w=\\sqrt{u^2+v^2}$\n- **মোট অতিক্রান্ত পথ:** $s=\\sqrt{d^2+x^2}=w\\cdot t_{min}$\n- **লব্ধি বেগ কোন দিকে:** পাড়ের সাথে $\\tan\\theta=\\dfrac{v}{u}$\n\n### ↗️ কেস ৩: যেকোনো কোণে ($\\alpha$) পার হওয়া\n\n$$t=\\frac{d}{v\\sin\\alpha}$$\n$$\\text{ড্রিফট}\\ x=(u+v\\cos\\alpha)\\,t=\\frac{(u+v\\cos\\alpha)\\,d}{v\\sin\\alpha}$$\n\n**দুটো সহজ সত্য:**\n- $\\alpha<90^\\circ$ (ভাটির দিকে হেলানো) হলে $\\cos\\alpha>0$, ড্রিফট আরও বাড়ে\n- $\\alpha>90^\\circ$ (উজানের দিকে হেলানো) হলে ড্রিফট কমে। $\\cos\\alpha=-u/v$ বসালে ড্রিফট শূন্য হয়ে যায় (কেস ১)\n\n---\n\n## ৩. সমাধান করা উদাহরণ (একই নদী দিয়ে তিন কেস)\n\n### উদাহরণ ১: বোর্ড সিকিউ স্টাইল\n\n$500\\ \\text{m}$ চওড়া নদীতে স্রোতের বেগ $u=3\\ \\text{m/s}$। রহমত মাঝি স্থির পানিতে $v=6\\ \\text{m/s}$ বেগে নৌকা চালাতে পারেন।\n\n**(ক) সবচেয়ে কম সময়ে পার হতে চাইলে:**\n\n$\\alpha=90^\\circ$\n$$t_{min}=\\frac{500}{6}=83.33\\ \\text{s}$$\n$$\\text{ড্রিফট}\\ x=3\\times83.33=250\\ \\text{m}$$\n$$w=\\sqrt{3^2+6^2}=\\sqrt{45}=6.71\\ \\text{m/s}$$\n$$\\text{পথ}\\ s=\\sqrt{500^2+250^2}=\\sqrt{312500}=559\\ \\text{m}$$\n\n**(খ) সোজা বিপরীত ঘাটে পৌঁছাতে চাইলে:**\n\n$$\\cos\\alpha=-\\frac{3}{6}=-0.5\\ \\Rightarrow\\ \\alpha=120^\\circ$$\n\nমানে স্রোতের দিক থেকে $120^\\circ$ কোণে, অর্থাৎ পাড়ের লম্ব থেকে $30^\\circ$ উজানের দিকে হেলিয়ে (যাচাই: $\\sin\\phi=u/v=0.5\\Rightarrow\\phi=30^\\circ$ ✓)।\n\n$$w=\\sqrt{6^2-3^2}=\\sqrt{27}=5.196\\ \\text{m/s}$$\n$$t=\\frac{500}{5.196}\\approx96.2\\ \\text{s}$$\n\n**(গ) সিদ্ধান্ত:** সোজা ঘাটে পৌঁছাতে সময় লাগে $96.2\\ \\text{s}$, যা সর্বনিম্ন সময় $83.33\\ \\text{s}$-এর চেয়ে বেশি। কারণ (খ)-তে নৌকার বেগের একটা অংশ স্রোত কাটাতে খরচ হয়ে গেছে, নদী পার হতে কাজে লাগেনি।\n\n### উদাহরণ ২: যেকোনো কোণে\n\n$d=200\\ \\text{m},\\ u=2\\ \\text{m/s},\\ v=4\\ \\text{m/s},\\ \\alpha=60^\\circ$ (ভাটির দিক থেকে)।\n\n$$v_y=4\\sin60^\\circ=3.464\\ \\text{m/s}\\Rightarrow t=\\frac{200}{3.464}=57.7\\ \\text{s}$$\n$$v_x=2+4\\cos60^\\circ=2+2=4\\ \\text{m/s}\\Rightarrow x=4\\times57.7=230.9\\ \\text{m}$$\n$$w=\\sqrt{4^2+3.464^2}=\\sqrt{28}=5.29\\ \\text{m/s}$$\n\n### উদাহরণ ৩: বাস্তব জীবনের ফেরি 🚢\nএকটা ফেরির গতি স্থির পানিতে $10\\ \\text{m/s}$, নদী $1200\\ \\text{m}$ চওড়া, স্রোত $6\\ \\text{m/s}$। ফেরি ঠিক উল্টো ঘাটে ভিড়তে চায়।\n\n$$\\sin\\phi=\\frac{6}{10}=0.6\\ \\Rightarrow\\ \\phi=36.87^\\circ\\ (\\text{লম্ব থেকে উজানে})$$\n$$w=\\sqrt{100-36}=8\\ \\text{m/s},\\qquad t=\\frac{1200}{8}=150\\ \\text{s}$$\n\nসবচেয়ে কম সময়ে পার হলে: $t=1200/10=120\\ \\text{s}$ এবং ড্রিফট $=6\\times120=720\\ \\text{m}$। মানে ঘাট থেকে $720\\ \\text{m}$ ভাটিতে গিয়ে ভিড়বে। এ কারণেই ফেরিঘাট সাধারণত উজান-ভাটি মিলিয়ে হিসাব করে বানানো হয়।\n\n---\n\n## ৪. আরও গুরুত্বপূর্ণ কেস (বুয়েট ও ভর্তি পরীক্ষা লেভেল)\n\n### 🚨 ৪.১: স্রোত নৌকার চেয়ে জোরে ($u>v$) হলে\n\n**বড় ভুল ধারণা:** \"স্রোত জোরে হলে নদী পার হওয়াই যায় না।\" **এটা ভুল।**\n\n- **নদী পার হওয়া সবসময় সম্ভব।** কারণ যতক্ষণ $v\\sin\\alpha>0$ থাকে, নৌকা প্রস্থ বরাবর এগোয়। স্রোত এই দিকে কিছুই করে না। তবে ভাটির দিকে বহুদূরে ভেসে গিয়ে ভিড়তে হবে।\n- **সোজা বিপরীত ঘাটে যাওয়া অসম্ভব।** কারণ $\\cos\\alpha=-u/v<-1$ হয়ে যায়।\n\n**তাহলে ড্রিফট সবচেয়ে কম কত করা যায়?** (বুয়েট প্রিয় প্রশ্ন)\n\nড্রিফট $x=\\dfrac{(u+v\\cos\\alpha)d}{v\\sin\\alpha}$ কে $\\alpha$ চলক ধরে নূন্যতম করলে ($\\tfrac{dx}{d\\alpha}=0$):\n\n$$\\cos\\alpha=-\\frac{v}{u}\\qquad\\Rightarrow\\qquad\\boxed{x_{min}=\\frac{d\\sqrt{u^2-v^2}}{v}}$$\n\n**জ্যামিতিক ব্যাখ্যা:** $u$ ভেক্টরের মাথা থেকে $v$ ব্যাসার্ধের একটা বৃত্ত আঁকো। মূলবিন্দু থেকে ওই বৃত্তের স্পর্শক টানলে সেটাই লব্ধি বেগের সবচেয়ে \"উজানমুখী\" দিক, আর তাতেই ড্রিফট সবচেয়ে কম।\n\n**উদাহরণ:** $u=5\\ \\text{m/s},\\ v=3\\ \\text{m/s},\\ d=120\\ \\text{m}$\n\n- $\\cos\\alpha=-3/5\\Rightarrow\\alpha=126.87^\\circ$\n- $x_{min}=\\dfrac{120\\times\\sqrt{25-9}}{3}=\\dfrac{120\\times4}{3}=160\\ \\text{m}$\n- সময় $t=\\dfrac{d}{v\\sin\\alpha}=\\dfrac{120}{3\\times0.8}=50\\ \\text{s}$\n\n### 🏃 ৪.২: উজান ও ভাটিতে চলা (একই রেখায়)\n\n- ভাটির দিকে ($\\alpha=0^\\circ$): মোট বেগ $=v+u$\n- উজানের দিকে ($\\alpha=180^\\circ$): মোট বেগ $=v-u$ (এ জন্য $v>u$ হতে হবে)\n\n**আসা-যাওয়ায় সময়:** নদীর পাড় বরাবর $L$ দূরত্বে গিয়ে ফিরে আসতে:\n\n$$t=\\frac{L}{v+u}+\\frac{L}{v-u}=\\frac{2vL}{v^2-u^2}$$\n\n**স্থির পানিতে সময় হতো** $\\dfrac{2L}{v}$। তুলনা করলে দেখা যায় স্রোত থাকলে মোট সময় **বেশি** লাগে।\n\n**উদাহরণ:** $L=600\\ \\text{m},\\ v=5\\ \\text{m/s},\\ u=3\\ \\text{m/s}$\n- ভাটিতে: $600/8=75\\ \\text{s}$\n- উজানে: $600/2=300\\ \\text{s}$\n- মোট $=375\\ \\text{s}$\n- স্থির পানিতে হতো $=2\\times600/5=240\\ \\text{s}$\n\nস্রোত \"যাওয়ায় কতটা সাহায্য করে\" আর \"আসায় কতটা বাধা দেয়\", দুটো সমান নয়। বাধার প্রভাব বেশি, তাই মোট সময় বাড়ে।\n\n### 🏎️ ৪.৩: ত্বরান্বিত নৌকা\n\nনৌকা যদি নিজের মুখের দিকে (মুখ $\\alpha$ কোণে ধরে) $a$ ত্বরণে চলে এবং আদিবেগ $v_0$ হয়:\n\n- প্রস্থ বরাবর ত্বরণ $=a\\sin\\alpha$, আদি বেগ $=v_0\\sin\\alpha$\n- $$d=(v_0\\sin\\alpha)\\,t+\\tfrac12(a\\sin\\alpha)\\,t^2$$\n- স্থির অবস্থা থেকে শুরু ($v_0=0$): $$t=\\sqrt{\\frac{2d}{a\\sin\\alpha}}$$\n\nস্রোতের বেগ ধ্রুব ধরলে $y$ দিকের হিসাবে তার কোনো ভূমিকা নেই। **সবচেয়ে কম সময়ে** পার হতে হলে এখানেও $\\alpha=90^\\circ$।\n\n**উদাহরণ:** $d=100\\ \\text{m}$, নৌকা স্থির থেকে সোজা ওপারের দিকে $a=2\\ \\text{m/s}^2$ ত্বরণে চলছে। $t=\\sqrt{2\\times100/2}=10\\ \\text{s}$।\n\n### 🚓 ৪.৪: পুলিশ ও চোর (তাড়া করার সমস্যা)\n\n**পরিস্থিতি:** নদীর এক পাড়ে চোর পাড় বরাবর সমবেগে দৌড়াচ্ছে। অপর পাড় থেকে পুলিশ নৌকায় $v$ বেগে $\\alpha$ কোণে রওনা হলো। পুলিশ ঠিক নদী পার হওয়ার সময়ই চোরের কাছে পৌঁছাতে চায়।\n\n**শর্ত (ধরে নিচ্ছি রওনার মুহূর্তে চোর পুলিশের ঠিক বিপরীতে ছিল):** ওপারে পৌঁছানোর সময় দুজনের পাড় বরাবর সরণ সমান হতে হবে।\n\n$$w_{thief}\\cdot t=(u+v\\cos\\alpha)\\,t\\ \\Rightarrow\\ \\boxed{w_{thief}=u+v\\cos\\alpha}$$\n\nসময় $t$ দুজনের জন্য এক, তাই সমীকরণ থেকে বাদ যায়। এখান থেকে সরাসরি $\\alpha$ বের হয়।\n\n> যদি চোর শুরুতে ঠিক বিপরীতে না থেকে $s$ দূরত্বে আগে থাকে, তাহলে সমীকরণ হবে $w_{thief}\\,t+s=(u+v\\cos\\alpha)\\,t$। চোরের দিক ভাটির দিকে ধরলে $w_{thief}$ ধনাত্মক, উজানের দিকে ধরলে ঋণাত্মক।\n\n**উদাহরণ ক:** $d=100\\ \\text{m},\\ u=2\\ \\text{m/s},\\ v=5\\ \\text{m/s}$, চোর ভাটির দিকে $3\\ \\text{m/s}$-এ দৌড়াচ্ছে।\n\n$$3=2+5\\cos\\alpha\\Rightarrow\\cos\\alpha=0.2\\Rightarrow\\alpha=78.46^\\circ$$\n$$t=\\frac{100}{5\\sin\\alpha}=\\frac{100}{5\\times0.9798}=20.4\\ \\text{s}$$\nযাচাই: চোর গেল $3\\times20.4=61.2\\ \\text{m}$; পুলিশের $v_x=2+5\\times0.2=3\\ \\text{m/s}$, সরণ একই ✓\n\n**উদাহরণ খ:** একই নদী, কিন্তু চোর **উজানের দিকে** $1\\ \\text{m/s}$-এ দৌড়াচ্ছে ($w_{thief}=-1$)।\n\n$$-1=2+5\\cos\\alpha\\Rightarrow\\cos\\alpha=-0.6\\Rightarrow\\alpha=126.87^\\circ,\\ \\sin\\alpha=0.8$$\n$$t=\\frac{100}{5\\times0.8}=25\\ \\text{s}$$\n\n### 🏊 ৪.৫: সময় ও ড্রিফট দুটোই চাইলে\nসাঁতারু $0.5\\ \\text{m/s}$, স্রোত $0.3\\ \\text{m/s}$, নদী $80\\ \\text{m}$।\n\n- সবচেয়ে কম সময়: $t=80/0.5=160\\ \\text{s}$; ড্রিফট $=0.3\\times160=48\\ \\text{m}$\n- সোজা ঘাটে যেতে: $\\cos\\alpha=-0.6\\Rightarrow\\alpha=126.87^\\circ$; $w=\\sqrt{0.25-0.09}=0.4\\ \\text{m/s}$; $t=80/0.4=200\\ \\text{s}$\n\n---\n\n## ৫. পরীক্ষায় সাধারণ ভুলের তালিকা ❌➜✅\n\n| ভুল | সঠিক |\n|---|---|\n| \"সোজা ঘাটে যেতে হলে নৌকা সোজা ওপারের দিকে ধরতে হবে\" | সোজা ঘাটে যেতে হলে **উজানের দিকে হেলাতে হবে**। সোজা ধরলে ড্রিফট হবেই |\n| \"সবচেয়ে কম সময় আর সবচেয়ে কম দূরত্ব একই উত্তর\" | দুটো আলাদা কেস। কম সময়ে $\\alpha=90^\\circ$, সোজা ঘাটে $\\alpha=\\cos^{-1}(-u/v)$ |\n| $t=d/w$ ব্যবহার করা (লব্ধি বেগ দিয়ে) | সময় হবে $d/v_y$, যেখানে $v_y=v\\sin\\alpha$। কেস ১ ছাড়া $w\\neq v_y$ |\n| $u>v$ হলে নদী পার হওয়া অসম্ভব ভাবা | নদী পার হওয়া সম্ভব, শুধু সোজা ঘাটে পৌঁছানো অসম্ভব |\n| কোণ কার সাথে দেওয়া দেখা না | ভাটির দিক, উজানের দিক বা লম্ব থেকে দেওয়া কোণ এক নয়, রূপান্তর করো |\n| ড্রিফট হিসাবে $u\\times d/v$ সব কেসে বসানো | $x=(u+v\\cos\\alpha)\\,d/(v\\sin\\alpha)$ হলো সাধারণ সূত্র। $u\\,d/v$ শুধু $\\alpha=90^\\circ$-এ |\n| একক না মেলানো ($\\text{km}$ আর $\\text{m/s}$ মিশিয়ে ফেলা) | সব $\\text{m}$ ও $\\text{m/s}$-এ আনো |\n\n---\n\n## ৬. এক নজরে সব সূত্র (Formula Sheet)\n\n**উপাংশ:** $v_x=u+v\\cos\\alpha,\\quad v_y=v\\sin\\alpha,\\quad w=\\sqrt{u^2+v^2+2uv\\cos\\alpha}$\n\n**যেকোনো কোণে:** $t=\\dfrac{d}{v\\sin\\alpha},\\quad x=\\dfrac{(u+v\\cos\\alpha)\\,d}{v\\sin\\alpha}$\n\n**সবচেয়ে কম সময়:** $\\alpha=90^\\circ,\\ t_{min}=\\dfrac dv,\\ x=\\dfrac{ud}{v},\\ w=\\sqrt{u^2+v^2}$\n\n**সোজা বিপরীত ঘাটে ($v>u$):** $\\cos\\alpha=-\\dfrac uv$ (লম্ব থেকে উজানে $\\sin\\phi=\\dfrac uv$), $w=\\sqrt{v^2-u^2},\\ t=\\dfrac{d}{\\sqrt{v^2-u^2}}$\n\n**সবচেয়ে কম ড্রিফট ($u>v$):** $\\cos\\alpha=-\\dfrac vu,\\ x_{min}=\\dfrac{d\\sqrt{u^2-v^2}}{v}$\n\n**উজান-ভাটি:** ভাটিতে $v+u$, উজানে $v-u$; আসা-যাওয়ার সময় $\\dfrac{2vL}{v^2-u^2}$\n\n**ত্বরান্বিত নৌকা:** $d=(v_0\\sin\\alpha)\\,t+\\tfrac12(a\\sin\\alpha)\\,t^2$\n\n**পুলিশ-চোর:** $w_{thief}=u+v\\cos\\alpha$\n\n**কিছু মান:**\n\n| $\\alpha$ | $90^\\circ$ | $120^\\circ$ | $126.87^\\circ$ | $135^\\circ$ | $150^\\circ$ |\n|---|---|---|---|---|---|\n| $\\cos\\alpha$ | 0 | $-0.5$ | $-0.6$ | $-0.707$ | $-0.866$ |\n| $\\sin\\alpha$ | 1 | 0.866 | 0.8 | 0.707 | 0.5 |\n\n---\n\n## ৭. নিজে করো (উত্তরসহ)\n\n**প্রশ্ন ১.** নদী $300\\ \\text{m}$ চওড়া, $u=4\\ \\text{m/s}$, $v=5\\ \\text{m/s}$। (ক) সবচেয়ে কম সময় ও ড্রিফট (খ) সোজা ঘাটে যেতে সময় কত?\n> **উত্তর:** (ক) $t=300/5=60\\ \\text{s}$, $x=4\\times60=240\\ \\text{m}$। (খ) $w=\\sqrt{25-16}=3\\ \\text{m/s}$, $t=300/3=100\\ \\text{s}$ ($\\cos\\alpha=-0.8,\\ \\alpha=143.13^\\circ$)।\n\n**প্রশ্ন ২.** $u=3\\ \\text{m/s},\\ v=5\\ \\text{m/s}$। সোজা ঘাটে যেতে পাড়ের লম্ব থেকে উজানের দিকে কত ডিগ্রি হেলাতে হবে?\n> **উত্তর:** $\\sin\\phi=3/5=0.6\\Rightarrow\\phi=36.87^\\circ\\approx37^\\circ$\n\n**প্রশ্ন ৩.** $d=60\\ \\text{m},\\ u=3\\ \\text{m/s},\\ v=6\\ \\text{m/s},\\ \\alpha=90^\\circ$। নৌকা কোথায় পৌঁছাবে?\n> **উত্তর:** $t=10\\ \\text{s}$, ড্রিফট $=30\\ \\text{m}$ ভাটিতে, পথ $=\\sqrt{60^2+30^2}=67.08\\ \\text{m}$\n\n**প্রশ্ন ৪.** $u=6,\\ v=3\\ \\text{m/s},\\ d=90\\ \\text{m}$। সবচেয়ে কম ড্রিফট কত?\n> **উত্তর:** $x_{min}=\\dfrac{90\\sqrt{36-9}}{3}=30\\sqrt{27}=155.9\\ \\text{m}$\n\n**প্রশ্ন ৫.** নৌকা স্থির পানিতে $6\\ \\text{m/s}$, স্রোত $2\\ \\text{m/s}$, পাড় বরাবর $400\\ \\text{m}$ গিয়ে ফিরে আসতে সময়?\n> **উত্তর:** $400/8+400/4=50+100=150\\ \\text{s}$\n\n**প্রশ্ন ৬.** $d=150\\ \\text{m},\\ u=3\\ \\text{m/s},\\ v=5\\ \\text{m/s}$। চোর ভাটির দিকে $6\\ \\text{m/s}$-এ দৌড়াচ্ছে। পুলিশ কত কোণে ($\\alpha$) নৌকা চালালে ধরতে পারবে?\n> **উত্তর:** $6=3+5\\cos\\alpha\\Rightarrow\\cos\\alpha=0.6\\Rightarrow\\alpha=53.13^\\circ$; সময় $t=150/(5\\times0.8)=37.5\\ \\text{s}$\n\n**প্রশ্ন ৭.** $\\alpha=60^\\circ$, $u=2\\ \\text{m/s}$, $v=4\\ \\text{m/s}$, $d=100\\ \\text{m}$। সময় ও ড্রিফট কত?\n> **উত্তর:** $t=100/(4\\times0.866)=28.87\\ \\text{s}$; $v_x=2+2=4\\ \\text{m/s}$, $x=4\\times28.87=115.5\\ \\text{m}$\n\n---\n\n## ৮. সমস্যা সমাধানের ৫-ধাপ ছক\n\n1. **ছবি আঁকো:** নদী, স্রোতের তীর ($u$), নৌকার তীর ($v$) ও কোণ।\n2. **প্রশ্ন কী চায়?** সবচেয়ে কম সময় নাকি সোজা ঘাট, নাকি সাধারণ কোণ, তা শনাক্ত করো।\n3. **কোণ কার সাথে?** ভাটি, উজান নাকি লম্ব, দেখে নিজের $\\alpha$-তে রূপান্তর করো।\n4. **আগে $y$ দিকে সময় বের করো** ($t=d/v_y$)। **তারপর $x$ দিকে ড্রিফট** ($x=v_x\\,t$)।\n5. **যাচাই করো:** একক ঠিক আছে কি না, $v>u$ শর্ত মেলে কি না, উত্তর যুক্তিসঙ্গত কি না (সোজা ঘাটের সময় সবসময় সর্বনিম্ন সময়ের চেয়ে বেশি)।\n" }
          ]
        },
        {

};

let currentSubjectId = "physics1";
let currentChapterId = "ch2_vector";
let currentModuleId = "p1_c2_m1";
let currentFontSize = 16;

// ── THEME MANAGEMENT (Creme ⇄ Chocolate Brown) ──
function initTheme() {
  const savedTheme = localStorage.getItem('app-theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon(savedTheme);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const target = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', target);
  localStorage.setItem('app-theme', target);
  updateThemeIcon(target);
  showToast(target === 'dark' ? '🍫 চকলেট ব্রাউন থিম সক্রিয়' : '🍦 ক্রিম থিম সক্রিয়');
  
  if (currentModuleId === 'simulators') {
    calculateRiverBoat();
    calculateParallelogram();
    calculateLawnRoller();
  }
}

function updateThemeIcon(t) {
  const icon = document.getElementById('theme-icon');
  if (icon) {
    icon.textContent = t === 'dark' ? '🍦' : '🍫';
  }
}

// ── FONT RESIZING ──
function adjustFontSize(delta) {
  currentFontSize = Math.min(22, Math.max(14, currentFontSize + delta));
  const el = document.querySelector('.markdown-body');
  if (el) {
    el.style.fontSize = `${currentFontSize / 16 * 1.05}rem`;
  }
  showToast(`ফন্ট সাইজ: ${currentFontSize}px`);
}

// ── MOBILE DRAWER TOGGLE ──
function toggleMobileDrawer() {
  const sidebar = document.getElementById('app-sidebar');
  const backdrop = document.getElementById('drawer-backdrop');
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('open');
}

// ── HIERARCHICAL SIDEBAR BUILDER ──
function renderSidebar() {
  const container = document.getElementById('chapter-tree-container');
  const subject = PLATFORM_DATABASE.subjects.find(s => s.id === currentSubjectId);
  if (!subject) return;

  container.innerHTML = '';

  subject.chapters.forEach(ch => {
    const isExpanded = ch.id === currentChapterId;
    const block = document.createElement('div');
    block.className = 'chapter-block';

    block.innerHTML = `
      <div class="chapter-title" onclick="toggleChapter('${ch.id}')">
        <span>${ch.icon} অধ্যায় ${ch.number}: ${ch.name}</span>
        <span class="chapter-badge">${ch.modules.length} টি মডিউল</span>
      </div>
      <ul class="module-nav-list" id="mod-list-${ch.id}" style="${isExpanded ? '' : 'display:none'}">
        ${ch.modules.map(m => `
          <li class="module-nav-item ${m.id === currentModuleId ? 'active' : ''}">
            <a href="javascript:void(0)" onclick="${m.disabled ? 'showUpcomingToast()' : `switchModule('${m.id}')`}">
              <span>${m.title}</span>
              <span class="tag">${m.tag}</span>
            </a>
          </li>
        `).join('')}
      </ul>
    `;
    container.appendChild(block);
  });
}

function toggleChapter(chId) {
  currentChapterId = chId;
  renderSidebar();
}

function showUpcomingToast() {
  showToast('⏳ এই মডিউলটির কাজ চলছে, শীঘ্রই যুক্ত হবে!');
}

function handleSubjectChange(subjId) {
  currentSubjectId = subjId;
  const subj = PLATFORM_DATABASE.subjects.find(s => s.id === subjId);
  if (subj && subj.chapters.length > 0) {
    currentChapterId = subj.chapters[0].id;
    if (subj.chapters[0].modules.length > 0 && !subj.chapters[0].modules[0].disabled) {
      switchModule(subj.chapters[0].modules[0].id);
    }
  }
  renderSidebar();
}

// ── MODULE SWITCHER & RENDERER ──
function switchModule(modId) {
  currentModuleId = modId;
  
  // Close mobile drawer if open
  const sidebar = document.getElementById('app-sidebar');
  const backdrop = document.getElementById('drawer-backdrop');
  if (sidebar) sidebar.classList.remove('open');
  if (backdrop) backdrop.classList.remove('open');

  const container = document.getElementById('rendered-content');
  const footerContainer = document.getElementById('module-nav-footer');

  // Handle Simulators View
  if (modId === 'simulators') {
    document.getElementById('breadcrumb-active').textContent = 'পদার্থবিজ্ঞান সিমুলেটর ল্যাব';
    document.getElementById('reading-badge').textContent = '⚡ ৩টি ইন্টারেক্টিভ টুল';
    renderSimulators(container);
    footerContainer.innerHTML = '';
    window.scrollTo({top: 0, behavior: 'smooth'});
    renderSidebar();
    return;
  }

  // Find Module in Database
  let foundMod = null;
  let foundChap = null;
  let allMods = [];

  PLATFORM_DATABASE.subjects.forEach(s => {
    s.chapters.forEach(ch => {
      ch.modules.forEach((m, idx) => {
        if (!m.disabled) allMods.push({ mod: m, chap: ch, subj: s });
        if (m.id === modId) {
          foundMod = m;
          foundChap = ch;
        }
      });
    });
  });

  if (!foundMod || !foundMod.md) return;

  // Update Breadcrumbs
  document.getElementById('breadcrumb-active').textContent = foundMod.title;
  document.getElementById('reading-badge').textContent = `⏱️ ${foundMod.duration} পাঠ`;

  // Parse Markdown
  marked.setOptions({ gfm: true, breaks: true });
  container.innerHTML = marked.parse(foundMod.md);

  // Wrap Tables for smooth touch scroll
  container.querySelectorAll('table').forEach(tbl => {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    tbl.parentNode.insertBefore(wrap, tbl);
    wrap.appendChild(tbl);
  });

  // Render KaTeX Math
  if (window.renderMathInElement) {
    renderMathInElement(container, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false}
      ],
      throwOnError: false
    });
  }

  // Render Footer Next / Prev Navigation
  const curIdx = allMods.findIndex(item => item.mod.id === modId);
  let footerHtml = '';
  
  if (curIdx > 0) {
    const prev = allMods[curIdx - 1];
    footerHtml += `
      <div class="nav-footer-btn" onclick="switchModule('${prev.mod.id}')">
        <span class="direction">← পূর্ববর্তী মডিউল</span>
        <span class="title">${prev.mod.title}</span>
      </div>
    `;
  } else {
    footerHtml += `<div></div>`;
  }

  if (curIdx < allMods.length - 1) {
    const next = allMods[curIdx + 1];
    footerHtml += `
      <div class="nav-footer-btn" onclick="switchModule('${next.mod.id}')" style="text-align:right">
        <span class="direction">পরবর্তী মডিউল →</span>
        <span class="title">${next.mod.title}</span>
      </div>
    `;
  }

  footerContainer.innerHTML = footerHtml;

  renderSidebar();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ── SEARCH MODAL FUNCTIONALITY (CTRL+K) ──
function openSearchModal() {
  const modal = document.getElementById('search-modal');
  modal.classList.add('open');
  setTimeout(() => document.getElementById('modal-search-input').focus(), 100);
}

function closeSearchModal(e) {
  const modal = document.getElementById('search-modal');
  modal.classList.remove('open');
}

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openSearchModal();
  }
  if (e.key === 'Escape') {
    closeSearchModal();
  }
});

function handleModalSearch(query) {
  const q = query.trim().toLowerCase();
  const resultsContainer = document.getElementById('search-modal-results');
  if (!q) {
    resultsContainer.innerHTML = `
      <div style="padding:20px;text-align:center;color:var(--text-dim);font-size:0.88rem">
        অনুসন্ধান করতে কীওয়ার্ড টাইপ করুন...
      </div>
    `;
    return;
  }

  let results = [];
  PLATFORM_DATABASE.subjects.forEach(s => {
    s.chapters.forEach(ch => {
      ch.modules.forEach(m => {
        if (!m.md) return;
        if (m.title.toLowerCase().includes(q) || m.md.toLowerCase().includes(q)) {
          // Extract matching snippet
          let snippet = '';
          const idx = m.md.toLowerCase().indexOf(q);
          if (idx !== -1) {
            snippet = m.md.substring(Math.max(0, idx - 40), Math.min(m.md.length, idx + 80)).replace(/#/g, '');
          }
          results.push({ mod: m, chap: ch, snippet });
        }
      });
    });
  });

  if (results.length === 0) {
    resultsContainer.innerHTML = `
      <div style="padding:20px;text-align:center;color:var(--text-dim);font-size:0.88rem">
        কোনো ফলাফল পাওয়া যায়নি! অন্য কোনো শব্দ দিয়ে চেষ্টা করুন।
      </div>
    `;
    return;
  }

  resultsContainer.innerHTML = results.map(r => `
    <div class="search-result-item" onclick="switchModule('${r.mod.id}'); closeSearchModal();">
      <div class="item-title">${r.chap.name} • ${r.mod.title}</div>
      <div class="item-snippet">...${r.snippet}...</div>
    </div>
  `).join('');
}

// ── CALCULATION LOGIC ──

function calculateRiverBoat() {
  const u = parseFloat(document.getElementById('nb-u').value) || 0;
  const v = parseFloat(document.getElementById('nb-v').value) || 0;
  const alphaDeg = parseFloat(document.getElementById('nb-alpha').value) || 0;
  const d = parseFloat(document.getElementById('nb-d').value) || 0;
  
  const alphaRad = (alphaDeg * Math.PI) / 180;
  const vy = v * Math.sin(alphaRad);
  const vx = u + v * Math.cos(alphaRad);
  
  if (vy <= 0) {
    document.getElementById('res-t').textContent = 'অসম্ভব';
    document.getElementById('res-w').textContent = '-';
    document.getElementById('res-theta').textContent = '-';
    document.getElementById('res-x').textContent = '-';
    return;
  }

  const t = d / vy;
  const w = Math.sqrt(vx * vx + vy * vy);
  let thetaDeg = (Math.atan2(vy, vx) * 180) / Math.PI;
  if (thetaDeg < 0) thetaDeg += 360;
  const x = vx * t;

  document.getElementById('res-t').textContent = `${t.toFixed(2)} s`;
  document.getElementById('res-w').textContent = `${w.toFixed(2)} m/s`;
  document.getElementById('res-theta').textContent = `${thetaDeg.toFixed(2)}°`;
  document.getElementById('res-x').textContent = `${x.toFixed(2)} m`;

  drawRiverCanvas(u, v, alphaRad, vx, vy);
}

function drawRiverCanvas(u, v, alpha, vx, vy) {
  const canvas = document.getElementById('boatCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.clientWidth;
  const h = canvas.height = canvas.clientHeight;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

  ctx.clearRect(0, 0, w, h);

  ctx.fillStyle = isDark ? '#1a100a' : '#e6dccb';
  ctx.fillRect(0, 0, w, 20);
  ctx.fillRect(0, h - 20, w, 20);

  ctx.strokeStyle = isDark ? 'rgba(226, 155, 82, 0.12)' : 'rgba(181, 105, 32, 0.15)';
  ctx.lineWidth = 1;
  for (let i = 28; i < h - 20; i += 16) {
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(w, i);
    ctx.stroke();
  }

  const sx = w * 0.28;
  const sy = h - 20;
  const maxSpeed = Math.max(1, u + v);
  const scale = (w * 0.42) / maxSpeed;

  drawArrow(ctx, sx, sy, sx + u * scale, sy, '#f59e0b', 'u', 2.5);
  drawArrow(ctx, sx, sy, sx + v * Math.cos(alpha) * scale, sy - v * Math.sin(alpha) * scale, '#38bdf8', 'v', 2.5);
  drawArrow(ctx, sx, sy, sx + vx * scale, sy - vy * scale, '#10b981', 'w (লব্ধি)', 3);
}

function calculateParallelogram() {
  const p = parseFloat(document.getElementById('pl-p').value) || 0;
  const q = parseFloat(document.getElementById('pl-q').value) || 0;
  const alphaDeg = parseFloat(document.getElementById('pl-alpha').value) || 0;
  
  const alphaRad = (alphaDeg * Math.PI) / 180;
  const r = Math.sqrt(p * p + q * q + 2 * p * q * Math.cos(alphaRad));
  const thetaRad = Math.atan2(q * Math.sin(alphaRad), p + q * Math.cos(alphaRad));
  let thetaDeg = (thetaRad * 180) / Math.PI;
  if (thetaDeg < 0) thetaDeg += 360;

  document.getElementById('res-pl-r').textContent = `${r.toFixed(2)} N`;
  document.getElementById('res-pl-theta').textContent = `${thetaDeg.toFixed(2)}°`;
  document.getElementById('res-pl-max').textContent = `${(p + q).toFixed(2)} N`;
  document.getElementById('res-pl-min').textContent = `${Math.abs(p - q).toFixed(2)} N`;

  drawParallelogramCanvas(p, q, alphaRad, r, thetaRad);
}

function drawParallelogramCanvas(p, q, alpha, r, theta) {
  const canvas = document.getElementById('plCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.clientWidth;
  const h = canvas.height = canvas.clientHeight;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

  ctx.clearRect(0, 0, w, h);

  const sx = 25;
  const sy = h - 22;
  const maxLen = Math.max(1, p + q);
  const scale = (w - 60) / maxLen;

  const px = sx + p * scale;
  const py = sy;

  const qx = sx + q * Math.cos(alpha) * scale;
  const qy = sy - q * Math.sin(alpha) * scale;

  const rx = sx + (p + q * Math.cos(alpha)) * scale;
  const ry = sy - q * Math.sin(alpha) * scale;

  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.2)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(rx, ry);
  ctx.lineTo(qx, qy);
  ctx.stroke();
  ctx.setLineDash([]);

  drawArrow(ctx, sx, sy, px, py, '#f59e0b', 'P', 2.5);
  drawArrow(ctx, sx, sy, qx, qy, '#38bdf8', 'Q', 2.5);
  drawArrow(ctx, sx, sy, rx, ry, '#10b981', 'R', 3);
}

function calculateLawnRoller() {
  const m = parseFloat(document.getElementById('lr-m').value) || 0;
  const f = parseFloat(document.getElementById('lr-f').value) || 0;
  const thetaDeg = parseFloat(document.getElementById('lr-theta').value) || 0;
  const type = document.getElementById('lr-type').value;

  const g = 9.8;
  const w = m * g;
  const thetaRad = (thetaDeg * Math.PI) / 180;
  const vertComp = type === 'horizontal' ? f * Math.sin(thetaRad) : f * Math.cos(thetaRad);

  const pull = Math.max(0, w - vertComp);
  const push = w + vertComp;
  const diff = push - pull;

  document.getElementById('res-lr-w').textContent = `${w.toFixed(2)} N`;
  document.getElementById('res-lr-pull').textContent = `${pull.toFixed(2)} N`;
  document.getElementById('res-lr-push').textContent = `${push.toFixed(2)} N`;
  document.getElementById('res-lr-diff').textContent = `${diff.toFixed(2)} N`;

  drawRollerCanvas(type, thetaRad);
}

function drawRollerCanvas(type, theta) {
  const canvas = document.getElementById('lrCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.clientWidth;
  const h = canvas.height = canvas.clientHeight;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

  ctx.clearRect(0, 0, w, h);

  ctx.strokeStyle = isDark ? '#4a382e' : '#bfaaa0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(10, h - 18);
  ctx.lineTo(w - 10, h - 18);
  ctx.stroke();

  const cx = w * 0.45;
  const cy = h - 48;
  const r = 28;

  ctx.fillStyle = isDark ? '#281c16' : '#e6dccb';
  ctx.strokeStyle = varColor('--accent-primary');
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2 * Math.PI);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = isDark ? '#fff' : '#000';
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, 2 * Math.PI);
  ctx.fill();

  const fx = 48 * Math.cos(theta);
  const fy = 48 * Math.sin(theta);
  drawArrow(ctx, cx, cy, cx + fx, cy - fy, '#10b981', 'টান', 2.5);
  drawArrow(ctx, cx - fx, cy - fy, cx, cy, '#ef4444', 'ঠেলা', 2.5);
  drawArrow(ctx, cx, cy, cx, cy + 24, '#8b5cf6', 'W', 2);
}

function drawArrow(ctx, fromx, fromy, tox, toy, color, label, width) {
  const headlen = 7;
  const dx = tox - fromx;
  const dy = toy - fromy;
  const angle = Math.atan2(dy, dx);
  
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;

  ctx.beginPath();
  ctx.moveTo(fromx, fromy);
  ctx.lineTo(tox, toy);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(tox, toy);
  ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
  ctx.lineTo(tox, toy);
  ctx.fill();

  if (label) {
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText(label, tox + 4, toy - 3);
  }
}

function varColor(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#b56920';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── SCROLL PROGRESS & BACK TO TOP ──
window.addEventListener('scroll', () => {
  const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
  const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const scrolled = (winScroll / height) * 100;
  
  const prog = document.getElementById('reading-progress');
  if (prog) prog.style.width = scrolled + '%';

  const btt = document.getElementById('back-to-top');
  if (btt) {
    if (winScroll > 250) btt.classList.add('visible');
    else btt.classList.remove('visible');
  }
});

  switchModule('p1_c2_m1');
